<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concept S · Minimal Task View</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --background: #f8f7f4;
        --surface: #fffefa;
        --surface-2: #f1efea;
        --foreground: #2b2926;
        --muted: #77726b;
        --muted-2: #a7a19a;
        --border: rgba(43, 41, 38, 0.1);
        --border-strong: rgba(43, 41, 38, 0.16);
        --selected: #bf7743;
        --selected-soft: rgba(191, 119, 67, 0.12);
        --green: #4d8262;
        --green-soft: rgba(77, 130, 98, 0.12);
        --blue: #5c7896;
        --blue-soft: rgba(92, 120, 150, 0.12);
        --red: #b85c52;
        --red-soft: rgba(184, 92, 82, 0.12);
        --shadow:
          rgba(0, 0, 0, 0.02) 0 1px 1px,
          rgba(0, 0, 0, 0.03) 0 8px 24px,
          rgba(43, 41, 38, 0.06) 0 0 0 1px;
        color-scheme: light;
      }

      body.dark-playground {
        --background: #21201d;
        --surface: #25241f;
        --surface-2: #2b2a25;
        --foreground: #f7f7f5;
        --muted: color-mix(in srgb, #f7f7f5 58%, #21201d);
        --muted-2: color-mix(in srgb, #f7f7f5 38%, #21201d);
        --border: rgba(247, 247, 245, 0.1);
        --border-strong: rgba(247, 247, 245, 0.18);
        --selected: #bf7743;
        --selected-soft: rgba(191, 119, 67, 0.18);
        --green: #22c55e;
        --green-soft: rgba(34, 197, 94, 0.14);
        --blue: #7a8278;
        --blue-soft: rgba(122, 130, 120, 0.18);
        --red: #ef4444;
        --red-soft: rgba(239, 68, 68, 0.14);
        --info: #fbbf24;
        --info-soft: rgba(251, 191, 36, 0.16);
        --shadow:
          rgba(0, 0, 0, 0.18) 0 1px 1px,
          rgba(0, 0, 0, 0.24) 0 16px 40px,
          rgba(247, 247, 245, 0.08) 0 0 0 1px;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.35;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        border: 0;
        color: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid var(--border);
        padding: 18px 14px;
        background: color-mix(in srgb, var(--surface-2) 74%, var(--background));
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 24px;
      }

      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background:
          linear-gradient(135deg, rgba(191, 119, 67, 0.9), rgba(77, 130, 98, 0.75)),
          var(--selected);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }

      .brand-title {
        font-size: 13px;
        font-weight: 650;
      }

      .brand-subtitle {
        font-size: 11px;
        color: var(--muted);
      }

      .side-section {
        margin-top: 18px;
      }

      .side-label {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 650;
        color: var(--muted);
      }

      .control-list {
        display: grid;
        gap: 3px;
      }

      .control-button {
        width: 100%;
        min-height: 30px;
        padding: 6px 8px;
        border-radius: 6px;
        background: transparent;
        text-align: left;
        color: var(--muted);
        cursor: pointer;
      }

      .control-button:hover {
        background: rgba(43, 41, 38, 0.04);
        color: var(--foreground);
      }

      .control-button.active {
        background: var(--selected-soft);
        color: var(--foreground);
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        min-height: 57px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 22px;
        background: color-mix(in srgb, var(--surface) 76%, transparent);
        position: sticky;
        top: 0;
        z-index: 3;
      }

      .page-title {
        min-width: 0;
      }

      .page-title h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .page-title p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .segmented {
        display: flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-2);
      }

      .segmented button {
        height: 28px;
        padding: 0 10px;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
      }

      .segmented button.active {
        background: var(--surface);
        color: var(--foreground);
        box-shadow: rgba(43, 41, 38, 0.08) 0 0 0 1px;
      }

      .canvas {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 22px;
      }

      .workspace {
        max-width: 1280px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      .concept-shell {
        display: grid;
        grid-template-columns: minmax(290px, 390px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel.flat {
        box-shadow: none;
        background: color-mix(in srgb, var(--surface) 82%, transparent);
      }

      .panel-header {
        min-height: 44px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-title {
        margin: 0;
        font-size: 13px;
        font-weight: 650;
      }

      .panel-note {
        color: var(--muted);
        font-size: 12px;
      }

      .panel-body {
        padding: 12px;
      }

      .muted {
        color: var(--muted);
      }

      .fine {
        font-size: 12px;
      }

      .task-row {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: start;
        padding: 8px 10px;
        border-radius: 7px;
        background: transparent;
      }

      .task-row:hover {
        background: rgba(43, 41, 38, 0.035);
      }

      .state-square {
        width: 22px;
        height: 22px;
        border: 1px solid var(--border-strong);
        border-radius: 5px;
        display: grid;
        place-items: center;
        color: var(--muted);
        background: var(--surface);
      }

      .state-square.working {
        border-color: rgba(191, 119, 67, 0.5);
        color: var(--selected);
      }

      .state-square.review {
        border-color: rgba(184, 92, 82, 0.35);
        color: var(--red);
      }

      .state-square.done {
        border-color: rgba(77, 130, 98, 0.38);
        color: var(--green);
      }

      .state-square.waiting {
        border-color: rgba(92, 120, 150, 0.4);
        color: var(--blue);
      }

      .state-dot {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
      }

      .state-check {
        width: 8px;
        height: 5px;
        border-left: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg) translateY(-1px);
      }

      .state-clock {
        width: 9px;
        height: 9px;
        border: 1.4px solid currentColor;
        border-radius: 50%;
        position: relative;
      }

      .state-clock::before,
      .state-clock::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1px;
        background: currentColor;
        transform-origin: top center;
      }

      .state-clock::before {
        height: 3px;
        transform: translate(-50%, -50%);
      }

      .state-clock::after {
        height: 4px;
        transform: rotate(118deg) translate(0, -1px);
      }

      .task-title {
        font-weight: 620;
        line-height: 1.28;
      }

      .task-secondary {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .chip {
        height: 22px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 6px;
        padding: 0 7px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .chip.selected {
        background: var(--selected-soft);
        color: color-mix(in srgb, var(--selected) 64%, var(--foreground));
      }

      .chip.green {
        background: var(--green-soft);
        color: color-mix(in srgb, var(--green) 70%, var(--foreground));
      }

      .chip.blue {
        background: var(--blue-soft);
        color: color-mix(in srgb, var(--blue) 72%, var(--foreground));
      }

      .chip.red {
        background: var(--red-soft);
        color: color-mix(in srgb, var(--red) 72%, var(--foreground));
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .summary-cell {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 9px;
        background: color-mix(in srgb, var(--surface-2) 50%, transparent);
        min-height: 70px;
      }

      .summary-cell label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        margin-bottom: 5px;
      }

      .summary-cell div {
        font-size: 13px;
      }

      .next-action {
        border: 1px solid color-mix(in srgb, var(--selected) 28%, var(--border));
        background: var(--selected-soft);
        border-radius: 8px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .next-action strong {
        display: block;
        margin-bottom: 2px;
      }

      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .primary-button,
      .secondary-button,
      .ghost-button {
        min-height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 600;
      }

      .primary-button {
        color: var(--background);
        background: var(--foreground);
      }

      .secondary-button {
        color: var(--foreground);
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--border-strong);
      }

      .ghost-button {
        color: var(--muted);
        background: transparent;
      }

      .timeline {
        display: grid;
        gap: 0;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 72px 18px minmax(0, 1fr);
        gap: 8px;
        padding: 0 0 12px;
      }

      .timeline-time {
        color: var(--muted);
        font-size: 11px;
        padding-top: 2px;
        text-align: right;
      }

      .timeline-rail {
        position: relative;
        display: flex;
        justify-content: center;
      }

      .timeline-rail::before {
        content: "";
        position: absolute;
        top: 17px;
        bottom: -12px;
        width: 1px;
        background: var(--border);
      }

      .timeline-item:last-child .timeline-rail::before {
        display: none;
      }

      .timeline-pin {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-top: 4px;
        background: var(--muted-2);
        box-shadow: 0 0 0 4px var(--surface);
        z-index: 1;
      }

      .timeline-pin.action {
        background: var(--selected);
      }

      .timeline-pin.wait {
        background: var(--blue);
      }

      .timeline-pin.done {
        background: var(--green);
      }

      .timeline-content {
        min-width: 0;
      }

      .timeline-title {
        font-weight: 620;
        font-size: 13px;
      }

      .timeline-detail {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 12px;
      }

      .hybrid-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 12px;
        align-items: start;
      }

      .task-lens {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 276px;
        gap: 10px;
        align-items: start;
      }

      .right-rail {
        display: grid;
        gap: 10px;
        align-self: start;
      }

      .right-rail .timeline-item {
        grid-template-columns: 48px 16px minmax(0, 1fr);
        gap: 7px;
        padding-bottom: 10px;
      }

      .right-rail .timeline-time {
        font-size: 10px;
      }

      .right-rail .timeline-detail {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .stack {
        display: grid;
        gap: 9px;
      }

      .section-title {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .quiet-section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 12px;
      }

      .work-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface-2) 42%, transparent);
        padding: 10px;
      }

      .work-card.emphasis {
        background: var(--selected-soft);
        border-color: color-mix(in srgb, var(--selected) 28%, var(--border));
      }

      .work-card.blue {
        background: var(--blue-soft);
        border-color: color-mix(in srgb, var(--blue) 25%, var(--border));
      }

      .work-card.green {
        background: var(--green-soft);
        border-color: color-mix(in srgb, var(--green) 25%, var(--border));
      }

      .work-card.red {
        background: var(--red-soft);
        border-color: color-mix(in srgb, var(--red) 25%, var(--border));
      }

      .card-title {
        font-weight: 650;
        margin-bottom: 3px;
      }

      .card-body {
        color: var(--muted);
        font-size: 12px;
      }

      .outliner {
        display: grid;
        gap: 3px;
      }

      .outline-surface {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px;
        background: color-mix(in srgb, var(--surface-2) 34%, transparent);
      }

      .outline-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: start;
        padding: 7px 8px;
        border-radius: 7px;
      }

      .outline-row:hover {
        background: rgba(43, 41, 38, 0.035);
      }

      .outline-row.selected {
        background: var(--selected-soft);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--selected) 24%, transparent);
      }

      .outline-row.card-row {
        margin-top: 4px;
        border: 1px solid color-mix(in srgb, var(--selected) 24%, var(--border));
        background: color-mix(in srgb, var(--selected-soft) 78%, var(--surface));
      }

      .outline-row.wait-row {
        border: 1px solid color-mix(in srgb, var(--blue) 24%, var(--border));
        background: color-mix(in srgb, var(--blue-soft) 70%, var(--surface));
      }

      .outline-row.child {
        margin-left: 23px;
      }

      .outline-title {
        font-weight: 610;
      }

      .outline-subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .mini-square {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid var(--border-strong);
        margin-top: 1px;
      }

      .mini-square.fill {
        background: var(--selected-soft);
        border-color: rgba(191, 119, 67, 0.38);
      }

      .mini-square.done {
        background: var(--green-soft);
        border-color: rgba(77, 130, 98, 0.38);
      }

      .mini-square.wait {
        background: var(--blue-soft);
        border-color: rgba(92, 120, 150, 0.38);
      }

      .progress-bar {
        height: 6px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: var(--progress, 45%);
        background: color-mix(in srgb, var(--selected) 76%, var(--green));
      }

      .detail-tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding: 0 12px;
      }

      .detail-tabs span {
        padding: 10px 0 8px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }

      .detail-tabs span.active {
        color: var(--foreground);
        border-color: var(--selected);
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }

      .metric-row:last-child {
        border-bottom: 0;
      }

      .raw-session {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #24221f;
        color: #e9e2d9;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        overflow: hidden;
      }

      .goal-state-card {
        border: 1px solid color-mix(in srgb, var(--selected) 28%, var(--border));
        border-radius: 8px;
        padding: 10px;
        background: color-mix(in srgb, var(--selected-soft) 72%, var(--surface));
      }

      .goal-state-card .card-title {
        font-size: 13px;
      }

      .rail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
      }

      .rail-header .section-title {
        margin: 0;
      }

      .action-card-stack {
        display: grid;
        gap: 8px;
      }

      .action-first-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 12px;
        align-items: start;
      }

      .message-card {
        border: 1px solid color-mix(in srgb, var(--selected) 30%, var(--border));
        border-radius: 8px;
        background: color-mix(in srgb, var(--selected-soft) 52%, var(--surface));
        overflow: hidden;
      }

      .message-card-header {
        min-height: 42px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid color-mix(in srgb, var(--selected) 18%, var(--border));
      }

      .message-card-title {
        font-weight: 680;
      }

      .message-card-meta {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .message-card-body {
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .message-fields {
        display: grid;
        gap: 5px;
        font-size: 12px;
      }

      .message-field {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 8px;
      }

      .message-field span:first-child {
        color: var(--muted);
      }

      .message-text {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        padding: 10px;
        color: var(--foreground);
        font-size: 13px;
        line-height: 1.42;
      }

      .message-card-footer {
        padding: 10px 12px;
        border-top: 1px solid color-mix(in srgb, var(--selected) 18%, var(--border));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .micro-outline {
        display: grid;
        gap: 1px;
      }

      .micro-outline .outline-row {
        padding-top: 5px;
        padding-bottom: 5px;
      }

      .context-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .context-pill {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface-2) 38%, transparent);
        padding: 9px;
      }

      .context-pill label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .context-pill div {
        font-size: 12px;
      }

      .compact-rail {
        display: grid;
        gap: 8px;
      }

      .compact-rail .work-card {
        padding: 9px;
      }

      .compact-rail .timeline-item {
        grid-template-columns: 42px 14px minmax(0, 1fr);
        gap: 6px;
        padding-bottom: 8px;
      }

      .compact-rail .timeline-detail {
        display: none;
      }

      .step-link {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        border-radius: 6px;
        background: var(--green-soft);
        color: color-mix(in srgb, var(--green) 76%, var(--foreground));
        padding: 0 7px;
        font-size: 12px;
        font-weight: 650;
      }

      .goal-outline-grid {

      function squareClass(state) {
        return states[state].square || "";
      }

      function stateGlyph(state) {
        const kind = squareClass(state);
        if (kind === "done") return '<span class="state-check"></span>';
        if (kind === "waiting") return '<span class="state-clock"></span>';
        return '<span class="state-dot"></span>';
      }

      function taskRow(stateKey) {
        const state = states[stateKey];
        const waitingChip =
          state.waiting.length > 0 ? `<span class="chip blue">${state.waiting.length} waiting</span>` : "";
        const reasonChip = state.suspendedReason
          ? `<span class="chip selected">${state.suspendedReason.replace("_", " ")}</span>`
          : "";
        return `
          <div class="task-row">
            <div class="state-square ${squareClass(stateKey)}">${stateGlyph(stateKey)}</div>
            <div>
              <div class="task-title">${state.title}</div>
              <div class="task-secondary">${state.subtitle}</div>
            </div>
            <div class="chips">
              <span class="chip">${state.status}</span>
              ${waitingChip}
              ${reasonChip}
            </div>
          </div>
        `;
      }

      function timeline(items) {
        return `
          <div class="timeline">
            ${items
              .map(
                ([time, title, detail, tone]) => `
                  <div class="timeline-item">
                    <div class="timeline-time">${time}</div>
                    <div class="timeline-rail"><span class="timeline-pin ${tone || ""}"></span></div>
                    <div class="timeline-content">
                      <div class="timeline-title">${title}</div>
                      <div class="timeline-detail">${detail}</div>
                    </div>
                  </div>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function cards(state) {
        if (state.cards.length === 0) {
          return `<div class="work-card"><div class="card-title">No open cards</div><div class="card-body">This state does not need user review.</div></div>`;
        }
        return state.cards
          .map(
            (card) => `
              <div class="work-card ${card.tone || ""}">
                <div class="card-title">${card.title}</div>
                <div class="card-body">${card.body}</div>
                <div class="button-row" style="margin-top: 9px;">
                  <button class="primary-button" type="button">${state.primary}</button>
                  <button class="secondary-button" type="button">${state.secondary}</button>
                </div>
              </div>
            `,
          )
          .join("");
      }

      function waits(state) {
        if (state.waits.length === 0) {
          return `<div class="work-card"><div class="card-title">Nothing waiting</div><div class="card-body">No external dependency is blocking this run.</div></div>`;
        }
        return state.waits
          .map(
            (wait) => `
              <div class="outline-row">
                <span class="mini-square wait"></span>
                <div>
                  <div class="outline-title">${wait.title}</div>
                  <div class="outline-subtitle">${wait.detail}</div>
                </div>
                <span class="chip blue">waiting</span>
              </div>
            `,
          )
          .join("");
      }

      function results(state) {
        if (state.results.length === 0) {
          return `<div class="work-card"><div class="card-title">No deliverables yet</div><div class="card-body">Results appear here once the run has produced something durable.</div></div>`;
        }
        return state.results

            (result) => `
              <div class="work-card green">
                <div class="card-title">${result.title}</div>
                <div class="card-body">${result.body}</div>
              </div>
            `,
          )

      }

      function goalHistory(state) {

      function outlineItemsForState(state) {
        const collectState = state.waits.length > 0 ? `${state.waits.length} waiting` : state.progress >= 62 ? "done" : "active";
        const collectClass = state.waits.length > 0 ? "blue" : state.progress >= 62 ? "green" : "selected";
        const messageState =
          state.progress >= 94 || state.status === "Done"
            ? "done"
            : state.cards.length > 0
              ? "review"
              : state.progress >= 62
                ? "next"
                : "queued";
        const messageClass =
          messageState === "done" ? "green" : messageState === "review" || messageState === "next" ? "selected" : "";
        return [
          {
            title: "Clarify intended outcome",
            detail: "Convert the rough task into an approved goal before autonomous execution.",
            status: state.progress >= 12 ? "done" : "active",
            chipClass: state.progress >= 12 ? "green" : "selected",
            square: state.progress >= 12 ? "done" : "fill",
          },
          {
            title: "Research venue options",
            detail: "Check fit, distance, reservation availability, and budget before contacting attendees.",
            status: state.progress >= 36 ? "done" : "active",
            chipClass: state.progress >= 36 ? "green" : "selected",
            square: state.progress >= 36 ? "done" : "fill",
          },
          {
            title: "Collect attendee responses",
            detail: state.waiting.length
              ? state.waiting.join(", ")
              : "Confirm attendance and dietary constraints for the group.",
            status: collectState,
            chipClass: collectClass,
            square: state.waits.length > 0 ? "wait" : state.progress >= 62 ? "done" : "fill",
          },
          {
            title: "Prepare attendee message",
            detail: "Draft and send the final confirmation once the reservation details are ready.",
            status: messageState,
            chipClass: messageClass,
            square: messageState === "done" ? "done" : "fill",

      function outlineSurface(stateKey, options = {}) {
        const state = states[stateKey];
        const items = outlineItemsForState(state);
        const currentIndex =
          state.waits.length > 0
            ? 2
            : state.cards.length > 0
              ? 3
              : state.progress >= 94
                ? 3
                : Math.max(0, items.findIndex((item) => item.status !== "done"));
        const childRows = items
          .map((item, index) => {
            const selected = index === currentIndex ? "selected" : "";
            return `
              <div class="outline-row child ${selected}">
                <span class="mini-square ${item.square}"></span>
                <div>
                  <div class="outline-title">${item.title}</div>
                  <div class="outline-subtitle">${item.detail}</div>
                </div>
                <span class="chip ${item.chipClass}">${item.status}</span>
              </div>
            `;
          })
          .join("");
        const inlineCards =
          options.inlineCards && (state.cards.length > 0 || state.waits.length > 0)
            ? `
              <div class="outline-row child ${state.waits.length > 0 ? "wait-row" : "card-row"}">
                <span class="mini-square ${state.waits.length > 0 ? "wait" : "fill"}"></span>

                  <div class="outline-title">${state.waits.length > 0 ? "Open waiting items" : state.cards[0].title}</div>

                    state.waits.length > 0

                      : state.cards[0].body
                  }</div>
                </div>
                <span class="chip ${state.waits.length > 0 ? "blue" : "selected"}">${
                  state.waits.length > 0 ? "waiting" : "review"

              </div>
            `
            : "";
        return `
          <div class="outline-surface">
            <div class="outline-row">
              <span class="mini-square fill"></span>
              <div>
                <div class="outline-title">${state.title}</div>
                <div class="outline-subtitle">${state.goal}</div>
              </div>
              <span class="chip selected">${state.status}</span>

        `;

      function renderMessageReview(stateKey) {

        return `

              </div>
              <div class="panel-body">${taskRow(stateKey)}</div>

            <div class="panel">

      function renderGoalStepAction(stateKey) {
        const state = states[stateKey];
        const currentStep =
          state.status === "Preparing cards"
            ? "Prepare attendee message"
            : state.status === "Needs review"
              ? "Prepare attendee message"
              : state.status === "Waiting on replies"
                ? "Collect attendee responses"
                : state.status === "Review final result" || state.status === "Done"
                  ? "Confirm task complete"
                  : "Clarify intended outcome";
        return `
          <div class="concept-shell">
            <div class="panel">
              <div class="panel-header">
                <p class="panel-title">Collapsed task row</p>
                <span class="panel-note">Goal-derived outline</span>
              </div>
              <div class="panel-body">
                ${taskRow(stateKey)}
                <div class="chips" style="padding: 0 10px 8px 41px;">
                  <span class="chip green">current step: ${currentStep}</span>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <p class="panel-title">Goal step action</p>
                <span class="panel-note">Action card tied to the goal outline</span>
              </div>
              <div class="panel-body goal-outline-grid">
                <main class="stack">
                  <div class="chips">
                    <span class="step-link">Completes step: ${currentStep}</span>
                    <span class="chip">${state.status}</span>
                  </div>
                  ${messageActionCard(state)}
                  <div>
                    <p class="section-title">Evidence so far</p>
                    ${results(state)}

                <aside class="compact-rail">
                  <div>
                    <div class="rail-header">
                      <p class="section-title">Goal-derived outline</p>
                      <span class="chip selected">${state.progress}%</span>
                    </div>
                    <div class="micro-outline">${outlineSurface(stateKey, { inlineCards: state.status === "Preparing cards" || state.status === "Needs review" })}</div>
                  </div>
                  <div class="goal-state-card">
                    <div class="rail-header">
                      <p class="section-title">Intended goal state</p>
                    </div>
                    <div class="card-body">${state.goal}</div>
                  </div>
                  <div>
                    <div class="rail-header">
                      <p class="section-title">Timeline</p>
                      <span class="chip">recent</span>
                    </div>
                    ${timeline(state.timeline.slice(-4))}
                  </div>
                </aside>
              </div>
            </div>
          </div>
        `;

      function currentGoalStepForState(state) {
        if (state.status === "Preparing cards" || state.status === "Needs review") return "Prepare attendee message";
        if (state.status === "Waiting on replies") return "Collect attendee responses";
        if (state.status === "Review final result" || state.status === "Done") return "Confirm task complete";
        if (state.status === "Runner is working") return "Research venue options";
        return "Clarify intended outcome";
      }

      function actionQueueSurface(state) {
        const step = currentGoalStepForState(state);
        const sideCard =
          state.status === "Preparing cards"
            ? `
              <div class="queue-side-card">
                <span class="chip selected" style="margin-bottom: 7px;">next likely card</span>
                <h4>Calendar invite</h4>
                <p>Optional invite after the confirmation email is approved.</p>
              </div>
            `
            : state.status === "Needs review"
              ? `
                <div class="queue-side-card">
                  <span class="chip" style="margin-bottom: 7px;">queued after send</span>
                  <h4>Calendar invite</h4>
                  <p>Create only if the user wants the dinner on everyone’s calendar.</p>
                </div>
              `
              : `
                <div class="queue-side-card">
                  <span class="chip" style="margin-bottom: 7px;">context</span>
                  <h4>${state.status}</h4>
                  <p>${state.now}</p>
                </div>
              `;
        return `
          <div class="action-queue">
            <div class="action-queue-header">
              <h3>Action cards</h3>
              <div class="chips">
                <span class="step-link">Handling: ${step}</span>
                <span class="chip">${state.status}</span>
              </div>
            </div>
            <div class="action-queue-body">
              ${messageActionCard(state)}
              ${sideCard}
            </div>
          </div>
        `;
      }

      function goalMapWithAttachedCards(stateKey) {
        const state = states[stateKey];
        const step = currentGoalStepForState(state);
        const attachedTitle =
          state.status === "Preparing cards"
            ? "Draft Gmail send card"
            : state.status === "Needs review"
              ? "Gmail send card"
              : state.status === "Waiting on replies"
                ? "Waiting items"
                : state.status === "Review final result"
                  ? "Final review card"
                  : "No card attached";
        const attachedStatus =
          state.status === "Preparing cards"
            ? "forming"
            : state.status === "Needs review"
              ? "needs review"
              : state.status === "Waiting on replies"
                ? "waiting"
                : state.status === "Review final result"
                  ? "review"
                  : "none";
        return `
          <div class="outline-surface">
            <div class="outline-row">
              <span class="mini-square fill"></span>
              <div>
                <div class="outline-title">${state.title}</div>
                <div class="outline-subtitle">${state.goal}</div>
              </div>
              <span class="chip selected">${state.progress}%</span>
            </div>
            ${outlineItemsForState(state)
              .map((item) => {
                const selected = item.title === step ? "selected" : "";
                const attached =
                  item.title === step && attachedStatus !== "none"
                    ? `
                      <div class="attached-card-label">
                        <div>
                          <strong>${attachedTitle}</strong>
                          <span class="muted">Attached action card for this goal step</span>
                        </div>
                        <span class="chip selected">${attachedStatus}</span>
                      </div>
                    `
                    : "";
                return `
                  <div class="outline-row child ${selected}">
                    <span class="mini-square ${item.square}"></span>
                    <div>
                      <div class="outline-title">${item.title}</div>
                      <div class="outline-subtitle">${item.detail}</div>
                    </div>
                    <span class="chip ${item.chipClass}">${item.status}</span>
                  </div>
                  ${attached}
                `;
              })
              .join("")}
          </div>
        `;
      }

      function renderActionQueueMap(stateKey) {
        const state = states[stateKey];
        return `
          <div class="concept-shell">
            <div class="panel">
              <div class="panel-header">
                <p class="panel-title">Collapsed task row</p>
                <span class="panel-note">Action-card priority</span>
              </div>
              <div class="panel-body">
                ${taskRow(stateKey)}
                <div class="chips" style="padding: 0 10px 8px 41px;">
                  <span class="chip selected">action cards first</span>
                  <span class="chip green">step: ${currentGoalStepForState(state)}</span>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <p class="panel-title">Action queue map</p>
                <span class="panel-note">Cards first, goal outline as map</span>
              </div>
              <div class="panel-body stack">
                ${actionQueueSurface(state)}
                <div class="action-map-grid">
                  <main>
                    <p class="section-title">Goal breakdown and attached actions</p>
                    ${goalMapWithAttachedCards(stateKey)}
                  </main>
                  <aside class="compact-rail">
                    <div>
                      <div class="rail-header">
                        <p class="section-title">Interim state</p>
                        <span class="chip">${state.suspendedReason || "active"}</span>
                      </div>
                      <div class="work-card">
                        <div class="card-title">${state.status}</div>
                        <div class="card-body">${state.now}</div>
                      </div>
                    </div>
                    <div>
                      <div class="rail-header">
                        <p class="section-title">Recent timeline</p>
                        <span class="chip">latest</span>
                      </div>
                      ${timeline(state.timeline.slice(-4))}
                    </div>
                  </aside>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function compactGoalSteps(state) {
        const step = currentGoalStepForState(state);
        return `
          <div class="goal-step-list">
            ${outlineItemsForState(state)
              .map((item) => {
                const active = item.title === step;
                const attached =
                  active && (state.status === "Preparing cards" || state.status === "Needs review")
                    ? `<span class="chip selected">${state.status === "Preparing cards" ? "card forming" : "card needs review"}</span>`
                    : `<span class="chip ${item.chipClass}">${item.status}</span>`;
                return `
                  <div class="goal-step-row ${active ? "active" : ""}">
                    <span class="mini-square ${item.square}"></span>
                    <div>
                      <div class="outline-title">${item.title}</div>
                      <div class="outline-subtitle">${item.detail}</div>
                    </div>
                    ${attached}
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function compactTimelineChips(state) {
        return `
          <div class="compact-timeline">
            ${state.timeline
              .slice(-4)
              .map(
                ([time, title, _detail, tone]) => `
                  <span class="timeline-chip ${tone || ""}">${time} · ${title}</span>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function bottomComposerSlot(state) {
        if (
          state.status === "Needs review" ||
          state.status === "Preparing cards" ||
          state.status === "Waiting on replies" ||
          state.status === "Review final result" ||
          state.status === "Waiting for goal"
        ) {
          return `
            <div class="composer-slot">
              <div class="chips" style="margin-bottom: 8px;">
                <span class="step-link">Attached to: ${currentGoalStepForState(state)}</span>
                <span class="chip">${state.status}</span>
              </div>
              ${messageActionCard(state)}
            </div>
          `;
        }
        return `
          <div class="composer-slot">
            <div class="composer-placeholder">
              <span>Add instructions or start a follow-up</span>
              <button class="secondary-button" type="button">Send</button>
            </div>
          </div>
        `;
      }

      function enhancedGoalItemsForState(state) {
        const items = outlineItemsForState(state).map((item) => ({ ...item }));
        if (state.status === "Review final result" || state.status === "Done") {
          items.push({
            title: "Confirm task complete",
            detail: "Review the final state, close the task, or revise the goal and continue.",
            status: state.status === "Done" ? "done" : "review",
            chipClass: state.status === "Done" ? "green" : "selected",
            square: state.status === "Done" ? "done" : "fill",
          });
        }
        return items;
      }

      function timelineEventsForGoalLine(state, item) {
        const keywordsByTitle = {
          "Clarify intended outcome": ["task created", "goal readiness", "question answered", "goal approved", "goal proposed"],
          "Research venue options": ["venue", "shortlist", "reservation held", "current lead"],
          "Collect attendee responses": ["replies", "messages sent", "waiting"],
          "Prepare attendee message": ["cards forming", "email drafted", "confirmation sent", "calendar"],
          "Confirm task complete": ["final review", "accepted"],
        };
        const keywords = keywordsByTitle[item.title] || [];
        return state.timeline.filter(([_time, title, detail]) => {
          const haystack = `${title} ${detail}`.toLowerCase();
          return keywords.some((keyword) => haystack.includes(keyword));
        });
      }

      function actionCardCountByStep(actions) {
        return actions.reduce((counts, action) => {
          counts[action.step] = (counts[action.step] || 0) + 1;
          return counts;
        }, {});
      }

      function primaryActionForState(state) {
        const step = currentGoalStepForState(state);
        if (state.status === "Needs review") {
          return {
            title: "Gmail send card",
            meta: "To: Alex, Priya, Sam, Mina, Diego, Lee",
            status: "needs review",
            statusClass: "selected",
            step,
            kind: "email",
            body:
              "Dinner is confirmed for Saturday at 7:30 PM at Foreign Cinema. The reservation is for six on the patio, and I included the dietary notes we collected. Please reply only if anything changed.",
            primary: "Send email",
            secondary: "Edit draft",
            footer: "Review the outgoing message before Runner sends it.",
          };
        }
        if (state.status === "Preparing cards") {
          return {
            title: "Draft Gmail send card",
            meta: "Forming from the reservation details",
            status: "forming",
            statusClass: "selected",
            step,
            kind: "plain",
            body:
              "Runner is assembling the confirmation email. It will become an approval card once the subject, recipients, and message body are ready.",
            primary: "Add constraint",
            secondary: "",
            footer: "Not approval-ready yet.",
          };
        }
        if (state.status === "Waiting on replies") {
          return {
            title: "Waiting items",
            meta: state.waiting.join(", "),
            status: "waiting",
            statusClass: "blue",
            step,
            kind: "plain",
            body:
              "Runner is suspended until enough external replies arrive. You can nudge people or mark a waiting item resolved if you have new information.",
            primary: "Nudge people",
            secondary: "Mark resolved",
            footer: "This card explains why the run is paused.",
          };
        }
        if (state.status === "Review final result") {
          return {
            title: "Final output",
            meta: "Agent says the goal is met",
            status: "final review",
            statusClass: "selected",
            step,
            kind: "plain",
            body:
              "Dinner is booked at Foreign Cinema for Saturday at 7:30 PM. All six attendees received the confirmation email. Dietary notes were included in the reservation.",
            primary: "Mark done",
            secondary: "Revise goal",
            footer: "Accept the final state or reopen the goal.",
          };
        }
        if (state.status === "Waiting for goal") {
          return {
            title: "Goal card",
            meta: "Approve before autonomous execution",
            status: "needs approval",
            statusClass: "selected",
            step,
            kind: "plain",
            body:
              "Arrange dinner for the six named attendees on Saturday near Moscone. Find 2-3 options under $80 per person, confirm dietary fit, then draft the outreach.",
            primary: "Approve goal",
            secondary: "Revise",
            footer: "The goal can be edited before the run starts.",
          };
        }
        return null;
      }

      function queuedActionsForState(state) {
        const primary = primaryActionForState(state);
        if (!primary) return [];
        if (state.status === "Needs review") {
          return [
            primary,
            {
              title: "Calendar invite card",
              meta: "Optional after email approval",
              status: "queued",
              statusClass: "",
              step: "Prepare attendee message",
              kind: "plain",
              body:
                "Create a calendar invite with the restaurant, time, and attendee list after the confirmation email is sent.",
              primary: "Review",
              secondary: "Dismiss",
              footer: "Queued behind the email approval.",
            },
            {
              title: "RSVP summary note",
              meta: "Uses collected attendee constraints",
              status: "queued",
              statusClass: "",
              step: "Collect attendee responses",
              kind: "plain",
              body:
                "Summarize the confirmed attendance and dietary notes in case the user wants to inspect the source facts.",
              primary: "Open",
              secondary: "",
              footer: "Mapped to a completed goal line.",
            },
          ];
        }
        if (state.status === "Preparing cards") {
          return [
            primary,
            {
              title: "Draft calendar invite",
              meta: "May be generated after email review",
              status: "forming",
              statusClass: "",
              step: "Prepare attendee message",
              kind: "plain",
              body:
                "Runner is deciding whether a calendar invite is needed or whether the confirmation email is sufficient.",
              primary: "Add constraint",
              secondary: "",
              footer: "Second card, same goal line.",
            },
          ];
        }
        if (state.status === "Waiting on replies") {
          return [
            primary,
            {
              title: "Nudge Priya",
              meta: "Missing dietary note",
              status: "queued",
              statusClass: "",
              step: "Collect attendee responses",
              kind: "plain",
              body: "Prepare a short follow-up asking Priya for the dietary constraint needed before booking.",
              primary: "Review nudge",
              secondary: "",
              footer: "Same waiting goal line.",
            },
          ];
        }
        return [primary];
      }

      function renderActionCardBody(action) {
        if (action.kind === "email") {
          return `
            <div class="message-fields">
              <div class="message-field"><span>Subject</span><strong>Dinner confirmed for Saturday</strong></div>
              <div class="message-field"><span>From</span><span>Matthew</span></div>
            </div>
            <div class="message-text">${action.body}</div>
          `;
        }
        return `<div class="message-text">${action.body}</div>`;
      }

      function renderAttachedActionCard(action, options = {}) {
        const compactClass = options.compact ? "queued-action-card" : "";
        return `
          <div class="message-card ${compactClass}">
            <div class="message-card-header">
              <div>
                <div class="message-card-title">${action.title}</div>
                <div class="message-card-meta">${action.meta}</div>
                <div class="attached-action-meta">Attached to: <strong>${action.step}</strong></div>
              </div>
              <span class="chip ${action.statusClass}">${action.status}</span>
            </div>
            <div class="message-card-body">
              ${renderActionCardBody(action)}
            </div>
            <div class="message-card-footer">
              <span class="fine muted">${action.footer}</span>
              <div class="button-row">
                ${action.primary ? `<button class="primary-button" type="button">${action.primary}</button>` : ""}
                ${action.secondary ? `<button class="secondary-button" type="button">${action.secondary}</button>` : ""}
              </div>
            </div>
          </div>
        `;
      }

      function renderFlatGoalOutline(state, actions) {
        const currentStep = currentGoalStepForState(state);
        const counts = actionCardCountByStep(actions);
        return `
          <section class="goal-outline-section">
            <div class="goal-outline-header">
              <div>
                <p class="section-title">Goal</p>
                <div class="goal-objective editable-text" contenteditable="true" spellcheck="false">${state.goal}</div>
              </div>
              <span class="chip selected">${state.progress}%</span>
            </div>
            <div class="goal-lines">
              ${enhancedGoalItemsForState(state)
                .map((item) => {
                  const isActive = item.title === currentStep || counts[item.title] > 0;
                  const lineEvents = timelineEventsForGoalLine(state, item);
                  const visibleEvents = lineEvents.slice(-2);
                  const hiddenEventCount = Math.max(0, lineEvents.length - visibleEvents.length);
                  const count = counts[item.title] || 0;
                  const chipLabel = count ? `${count} card${count > 1 ? "s" : ""}` : item.status;
                  const chipClass = count ? "selected" : item.chipClass;
                  return `
                    <div class="goal-line ${isActive ? "active" : ""}">
                      <span class="mini-square ${item.square}"></span>
                      <div>
                        <div class="goal-line-title-row">
                          <div class="goal-line-title editable-text" contenteditable="true" spellcheck="false">${item.title}</div>
                          <button class="line-edit-button" type="button">Edit</button>
                        </div>
                        <div class="goal-line-detail editable-text" contenteditable="true" spellcheck="false">${item.detail}</div>
                        ${
                          visibleEvents.length
                            ? `<div class="line-events">
                                ${visibleEvents
                                  .map(
                                    ([time, title, _detail, tone]) =>
                                      `<span class="line-event ${tone || ""}">${time} · ${title}</span>`,
                                  )
                                  .join("")}
                                ${
                                  hiddenEventCount
                                    ? `<button class="line-events-toggle" type="button">+${hiddenEventCount} more</button>`
                                    : ""
                                }
                              </div>`
                            : ""
                        }
                      </div>
                      <span class="chip ${chipClass}">${chipLabel}</span>
                    </div>
                  `;
                })
                .join("")}
            </div>
          </section>
        `;
      }

      function renderActionSection(state, actions) {
        if (!actions.length) {
          return `
            <section class="action-section">
              <div class="action-section-header">
                <p class="section-title">Action</p>
                <span class="chip">no cards</span>
              </div>
              <div class="action-empty-slot">
                <span>Add instructions or start a follow-up</span>
                <button class="secondary-button" type="button">Send</button>
              </div>
            </section>
          `;
        }
        const activeCount = actions.filter((action) => action.status.includes("review") || action.status.includes("approval")).length;
        return `
          <section class="action-section">
            <div class="action-section-header">
              <p class="section-title">${actions.length > 1 ? "Actions" : "Action"}</p>
              <div class="chips">
                <span class="chip selected">${actions.length} card${actions.length > 1 ? "s" : ""}</span>
                ${activeCount ? `<span class="chip">${activeCount} needs review</span>` : ""}
              </div>
            </div>
            <div class="action-card-stack">
              ${actions.map((action, index) => renderAttachedActionCard(action, { compact: index > 0 })).join("")}
            </div>
          </section>
        `;
      }

      function renderGoalActionFlat(stateKey) {
        const state = states[stateKey];
        const primaryAction = primaryActionForState(state);
        const actions = primaryAction ? [primaryAction] : [];
        return `
          <div class="two-section-detail">
            ${renderFlatGoalOutline(state, actions)}
            ${renderActionSection(state, actions)}
          </div>
        `;
      }

      function renderGoalActionQueue(stateKey) {
        const state = states[stateKey];
        const actions = queuedActionsForState(state);
        return `
          <div class="two-section-detail">
            ${renderFlatGoalOutline(state, actions)}
            ${renderActionSection(state, actions)}
          </div>
        `;
      }

      const ledgerStateOrder = [
        "staging_goal",
        "running",
        "waiting_external",
        "action_preview",
        "needs_review",
        "final_review",
        "completed",
      ];

      const ledgerExampleLabels = {
        dinner: "Dinner",
        renewal: "Renewal",
        release: "Beta release",
      };

      function ledgerAtLeast(stateKey, minimumStateKey) {
        return ledgerStateOrder.indexOf(stateKey) >= ledgerStateOrder.indexOf(minimumStateKey);
      }

      function ledgerEvent(id, from, time, title, actor, body) {

      function ledgerIndicatorForSubgoal(subgoal, stateKey, cards) {
        if (cards.some((card) => card.blocking)) return "needs-action";
        if (cards.some((card) => card.status === "forming")) return "working";
        if (subgoal.waitingIn?.includes(stateKey)) return "waiting";
        if (subgoal.workingIn?.includes(stateKey)) return "working";
        if (subgoal.doneFrom && ledgerAtLeast(stateKey, subgoal.doneFrom)) return "done";
        return "todo";
      }

      function ledgerIndicatorForOutlineItem(item, stateKey) {
        if (item.waitingIn?.includes(stateKey)) return "waiting";
        if (item.workingIn?.includes(stateKey)) return "working";
        if (item.doneFrom && ledgerAtLeast(stateKey, item.doneFrom)) return "done";
        return "todo";
      }

      function subgoalLedgerModel(state, stateKey = activeState, exampleId = activeLedgerExample) {
        const scenarios = buildLedgerScenarios();
        const scenario = scenarios[exampleId] || scenarios.dinner;
        const subgoals = scenario.subgoals.map((subgoal) => {
          const events = subgoal.events.filter((event) => ledgerAtLeast(stateKey, event.from));
          const cards = subgoal.cards.filter((card) => card.states.includes(stateKey));
          const children = (ledgerOutlineChildrenByScenario[exampleId]?.[subgoal.id] || []).map((item) => {
            const events = (item.events || ledgerChildHistoryById[item.id] || []).filter((event) => ledgerAtLeast(stateKey, event.from));
            const indicator = ledgerIndicatorForOutlineItem(item, stateKey);
            const resolution = indicator === "done" ? ledgerChildResolutionById[item.id] || null : null;
            return {
              ...item,
              events,
              resolution,
              indicator,
            };
          });
          const resolution = ledgerAtLeast(stateKey, subgoal.doneFrom || "completed")
            ? ledgerResolutionByScenario[exampleId]?.[subgoal.id] || null
            : null;
          return {
            ...subgoal,
            events,
            cards,
            children,
            resolution,
            indicator: ledgerIndicatorForSubgoal(subgoal, stateKey, cards),
          };
        });

        const currentSubgoalId = scenario.currentByState[stateKey] || subgoals[0]?.id;
        const defaultSubgoal =
          subgoals.find((subgoal) => subgoal.cards.some((card) => card.blocking)) ||
          subgoals.find((subgoal) => subgoal.id === currentSubgoalId && subgoal.cards.length > 0) ||
          subgoals.find((subgoal) => subgoal.id === currentSubgoalId) ||
          subgoals.find((subgoal) => subgoal.cards.length > 0) ||
          subgoals.findLast?.((subgoal) => subgoal.events.length > 0) ||
          subgoals[0];

        return {
          id: exampleId,
          title: scenario.title,
          ask: scenario.ask,
          goal: scenario.goal,
          status: scenario.statusByState[stateKey] || state.status,
          stateKey,
          stateLabel: state.label,
          subgoals,
          defaultSubgoalId: defaultSubgoal?.id || currentSubgoalId,
          examples: ledgerExampleLabels,
          activeExample: exampleId,
        };
      }

      function ledgerIndicatorLabel(indicator) {
        const labels = {
          todo: "Not started",
          done: "Done",
          working: "Runner is working",
          waiting: "Waiting",
          "needs-action": "Needs your response",
          "needs-review": "Needs review",
        };
        return labels[indicator] || "Task state";
      }

      function ledgerStatusPriority(indicator) {
        const order = {
          "needs-action": 5,
          working: 4,
          waiting: 3,
          todo: 2,
          done: 1,
        };
        return order[indicator] || 0;
      }

      function summarizeOutlineStates(subgoal) {
        const items = subgoal.children || [];
        const counts = items.reduce((memo, item) => {
          memo[item.indicator] = (memo[item.indicator] || 0) + 1;
          return memo;
        }, {});
        return { total: items.length, counts };
      }

      function aggregateSubgoalIndicator(subgoal) {
        const childIndicators = (subgoal.children || []).map((item) => item.indicator);
        return [subgoal.indicator, ...childIndicators].sort((a, b) => ledgerStatusPriority(b) - ledgerStatusPriority(a))[0] || subgoal.indicator;
      }

      function renderSubgoalAggregate(subgoal) {
        const { total, counts } = summarizeOutlineStates(subgoal);
        const parts = [];
        if (counts.done) parts.push(`${counts.done} done`);
        if (counts.working) parts.push(`${counts.working} working`);
        if (counts.waiting) parts.push(`${counts.waiting} waiting`);
        if (counts.todo) parts.push(`${counts.todo} todo`);
        if (subgoal.resolution) parts.push("1 output");
        if (!parts.length) return "";
        return `<div class="subgoal-aggregate">${parts.map((part) => `<span class="summary-chip">${part}</span>`).join("")}</div>`;
      }

      function renderLedgerExampleSwitcher(model) {
        return `
          <div class="ledger-example-switcher" aria-label="Example data">
            ${Object.entries(model.examples)
              .map(
                ([id, label]) =>
                  `<button class="ledger-example-button ${id === model.activeExample ? "active" : ""}" type="button" data-ledger-example="${id}">${label}</button>`,
              )
              .join("")}
          </div>
        `;
      }

      function renderLedgerActionModeSwitch(mode) {
        return `
          <div class="ledger-action-switch" aria-label="Action view">
            <button class="action-mode-button ${mode === "card" ? "active" : ""}" type="button" data-ledger-action-mode="card">Card</button>
            <button class="action-mode-button ${mode === "timeline" ? "active" : ""}" type="button" data-ledger-action-mode="timeline">Timeline</button>
          </div>
        `;
      }

      function renderLedgerActionCard(model, subgoalId, cardIndex = 0) {
        const subgoal = model.subgoals.find((item) => item.id === subgoalId) || model.subgoals[0];
        if (!subgoal) return renderLedgerEmptyAction(model);
        const cardCount = subgoal.cards.length;
        const safeCardIndex = cardCount ? Math.min(Math.max(cardIndex, 0), cardCount - 1) : 0;
        const card = subgoal.cards[safeCardIndex];
        if (!card) {
          return subgoal.indicator === "done" && subgoal.resolution
            ? renderLedgerOutputCard(model, subgoal)
            : renderLedgerStatusCard(model, subgoal);
        }
        return `
          <div class="ledger-action-header">
            <div class="ledger-action-title">
              <p>Needs attention</p>
              <strong>${card.title}</strong>
            </div>
            ${
              cardCount > 1
                ? `<div class="ledger-card-nav">
                    <button class="card-arrow-button" type="button" data-ledger-card-step="-1" data-ledger-card-nav="${subgoal.id}" aria-label="Previous action card">‹</button>
                    <span class="card-nav-position">${safeCardIndex + 1} / ${cardCount}</span>
                    <button class="card-arrow-button" type="button" data-ledger-card-step="1" data-ledger-card-nav="${subgoal.id}" aria-label="Next action card">›</button>
                  </div>`
                : ""
            }
          </div>
          <div class="ledger-card">
            <div class="ledger-card-header">
              <div>
                <div class="ledger-card-title">${card.title}</div>
                <div class="ledger-card-meta">${card.meta}</div>
                <div class="ledger-card-meta">Attached to: <strong>${subgoal.title}</strong></div>
              </div>
              <span class="ledger-neutral-chip">${card.status}</span>
            </div>
            <div class="ledger-card-body">
              <div class="ledger-message">${card.body}</div>
            </div>
            <div class="ledger-card-footer">
              <span class="fine muted">Attached to goal line</span>
              <div class="button-row">
                ${card.primary ? `<button class="primary-button" type="button">${card.primary}</button>` : ""}
                ${card.secondary ? `<button class="secondary-button" type="button">${card.secondary}</button>` : ""}
              </div>
            </div>
          </div>
        `;
      }

      function renderLedgerEmptyCard(subgoal) {
        return `
          <div class="ledger-action-header">
            <div class="ledger-action-title">
              <p>Needs attention</p>
              <strong>${subgoal.title}</strong>
            </div>
          </div>
          <div class="ledger-action-empty">
            No card needs your response for this goal line. Switch to Timeline to inspect the actions that already happened here.
          </div>
        `;
      }

      function renderLedgerOutputCard(model, subgoal) {
        const resolution = subgoal.resolution;
        if (!resolution) return renderLedgerStatusCard(model, subgoal);
        return `
          <div class="ledger-action-header">
            <div class="ledger-action-title">
              <p>Completion</p>
              <strong>${resolution.title}</strong>
            </div>
            <span class="ledger-neutral-chip">output</span>
          </div>
          <div class="ledger-card output-card">
            <div class="ledger-card-header">
              <div>
                <div class="ledger-card-title">${resolution.title}</div>
                <div class="ledger-card-meta">${resolution.meta}</div>
                <div class="ledger-card-meta">Attached to: <strong>${subgoal.title}</strong></div>
              </div>
              <span class="ledger-neutral-chip">resolved</span>
            </div>
            <div class="ledger-card-body">
              <div class="ledger-message">${resolution.body}</div>
              <div class="ledger-card-facts">
                ${(resolution.facts || []).map((fact) => `<span class="summary-chip">${fact}</span>`).join("")}
              </div>
            </div>
            <div class="ledger-card-footer">
              <span class="fine muted">Completion output for this goal line</span>
              <button class="secondary-button" type="button">Use as context</button>
            </div>
          </div>
        `;
      }

      function renderLedgerStatusCard(model, subgoal) {
        const summary = summarizeOutlineStates(subgoal);
        const latestEvent = subgoal.events[subgoal.events.length - 1];
        const statusCopy = {
          todo: {
            label: "Not started",
            title: "Waiting for its turn",
            body: "Runner has not started this goal line yet. It can begin after the current blocking action or prerequisite line is resolved.",
            chip: "not started",
          },
          working: {
            label: "Working",
            title: "Runner is making progress",
            body: latestEvent
              ? `Most recent progress: ${latestEvent.title}. ${latestEvent.body}`
              : "Runner is actively working on this goal line.",
            chip: "working",
          },
          waiting: {
            label: "Waiting",
            title: "Paused on an outside dependency",
            body: latestEvent
              ? `Current wait: ${latestEvent.body}`
              : "Runner cannot move this goal line forward until an outside response or scheduled time arrives.",
            chip: "waiting",
          },
          "needs-action": {
            label: "Needs attention",
            title: "A response is needed",
            body: "This line has an attached card that needs user attention.",
            chip: "needs review",
          },
        };
        const copy = statusCopy[subgoal.indicator] || statusCopy.todo;
        return `
          <div class="ledger-action-header">
            <div class="ledger-action-title">
              <p>${copy.label}</p>
              <strong>${subgoal.title}</strong>
            </div>
            <span class="ledger-neutral-chip">${copy.chip}</span>
          </div>
          <div class="ledger-card status-card">
            <div class="ledger-card-header">
              <div>
                <div class="ledger-card-title">${copy.title}</div>
                <div class="ledger-card-meta">Attached to: <strong>${subgoal.title}</strong></div>
              </div>
              <span class="ledger-state-icon ${subgoal.indicator}" aria-label="${ledgerIndicatorLabel(subgoal.indicator)}"></span>
            </div>
            <div class="ledger-card-body">
              <div class="ledger-message">${copy.body}</div>
              <div class="ledger-card-facts">
                ${summary.total ? `<span class="summary-chip">${summary.total} subtask${summary.total > 1 ? "s" : ""}</span>` : ""}
                ${summary.counts.done ? `<span class="summary-chip">${summary.counts.done} done</span>` : ""}
                ${summary.counts.todo ? `<span class="summary-chip">${summary.counts.todo} todo</span>` : ""}
                ${summary.counts.working ? `<span class="summary-chip">${summary.counts.working} working</span>` : ""}
                ${summary.counts.waiting ? `<span class="summary-chip">${summary.counts.waiting} waiting</span>` : ""}
              </div>
            </div>
            <div class="ledger-card-footer">
              <span class="fine muted">Status card for this goal line</span>
            </div>
          </div>
        `;
      }

      function renderLedgerHistoryPreview(model, subgoalId, eventId) {
        const subgoal = model.subgoals.find((item) => item.id === subgoalId) || model.subgoals[0];
        const event = subgoal?.events.find((item) => item.id === eventId) || subgoal?.events[0];
        if (!subgoal || !event) return renderLedgerEmptyAction(model);
        return `
          <div class="ledger-action-header">
            <div class="ledger-action-title">
              <p>Action</p>
              <strong>${subgoal.title}</strong>
            </div>
            <span class="ledger-actor-badge ${event.actor}">${event.actor}</span>
          </div>
          <div class="ledger-card history-preview ${event.actor}">
            <div class="ledger-card-header">
              <div>
                <div class="ledger-card-title">${event.title}</div>
                <div class="ledger-card-meta">${event.time}</div>
                <div class="ledger-card-meta">Attached to: <strong>${subgoal.title}</strong></div>
              </div>
              <span class="ledger-actor-badge ${event.actor}">${event.actor === "agent" ? "agent action" : "user action"}</span>
            </div>
            <div class="ledger-card-body">
              <div class="ledger-message">${event.body}</div>
            </div>
            <div class="ledger-card-footer">
              <span class="fine muted">History action preview</span>
            </div>
          </div>
        `;
      }

      function renderLedgerEmptyAction(model) {
        const latest = model.subgoals.flatMap((subgoal) => subgoal.events.map((event) => ({ subgoal, event }))).at(-1);
        if (latest) {
          return renderLedgerHistoryPreview(model, latest.subgoal.id, latest.event.id);
        }
        return `
          <div class="ledger-action-header">
            <div class="ledger-action-title">
              <p>Action</p>
              <strong>${model.status}</strong>
            </div>
            <span class="chip">idle</span>
          </div>
          <div class="ledger-card history-preview">
            <div class="ledger-card-body">
              <div class="ledger-message">No attached action has happened yet.</div>
            </div>
          </div>
        `;
      }

      function chunkLedgerEvents(events, size = 3) {
        const chunks = [];
        for (let index = 0; index < events.length; index += size) {
          chunks.push(events.slice(index, index + size));
        }
        return chunks;
      }

      function ledgerTimelineEvents(model) {
        return model.subgoals.flatMap((subgoal) => subgoal.events.map((event) => ({ subgoal, event })));
      }

      function renderLedgerSnakeTimeline(model, selectedSubgoalId, selectedEventId) {
        const timelineEvents = ledgerTimelineEvents(model);
        if (!timelineEvents.length) {
          return `<div class="ledger-action-empty">No historical actions recorded for this task yet.</div>`;
        }
        const rows = chunkLedgerEvents(timelineEvents, 4);
        return `
          <div class="ledger-snake-timeline" aria-label="Historical actions for this task">
            ${rows
              .map((row, rowIndex) => {
                return `
                  <div class="snake-row ${rowIndex % 2 === 0 ? "" : "reverse"}">
                    ${row
                      .map(
                        ({ subgoal, event }) =>
                          `<button class="history-chip ${event.actor} ${event.id === selectedEventId ? "active" : ""} ${subgoal.id === selectedSubgoalId ? "line-selected" : ""}" type="button" data-ledger-event="${event.id}" data-subgoal="${subgoal.id}">${event.time} · ${event.title}</button>`,
                      )
                      .join("")}
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function renderLedgerActionPanel(model, subgoalId, options = {}) {
        const subgoal = model.subgoals.find((item) => item.id === subgoalId) || model.subgoals[0];
        if (!subgoal) return renderLedgerEmptyAction(model);
        const mode = options.mode || activeActionMode || "card";
        const timelineEvents = ledgerTimelineEvents(model);
        const selectedTimelineEvent =
          mode === "timeline"
            ? timelineEvents.find(({ event }) => event.id === options.eventId) ||
              [...timelineEvents].reverse().find(({ subgoal: eventSubgoal }) => eventSubgoal.id === subgoal.id) ||
              timelineEvents[timelineEvents.length - 1] ||
              null
            : null;
        const selectedEventId = selectedTimelineEvent?.event.id || null;
        const body =
          mode === "timeline"
            ? `
              <div class="ledger-action-header">
                <div class="ledger-action-title">
                  <p>Past actions</p>
                  <strong>${timelineEvents.length} recorded</strong>
                </div>
                <span class="ledger-neutral-chip">click a time chip</span>
              </div>
              ${renderLedgerSnakeTimeline(model, subgoal.id, selectedEventId)}
              ${selectedTimelineEvent ? renderLedgerHistoryPreview(model, selectedTimelineEvent.subgoal.id, selectedTimelineEvent.event.id) : ""}
            `
            : renderLedgerActionCard(model, subgoal.id, options.cardIndex || 0);
        return `
          <div class="ledger-action-panel" data-selected-subgoal="${subgoal.id}" data-action-mode="${mode}">
            <div class="ledger-action-bar">
              <div class="ledger-action-context">Action for <strong>${subgoal.title}</strong></div>
              ${renderLedgerActionModeSwitch(mode)}
            </div>
            ${body}
          </div>
        `;
      }

      function renderOutlineChildRow(subgoal, child, hidden = false) {
        return `
          <div class="subgoal-row outliner-child ${hidden ? "is-hidden" : ""}" data-ledger-subgoal-select="${subgoal.id}" data-outline-child-of="${subgoal.id}">
            <span class="ledger-state-icon ${child.indicator}" aria-label="${ledgerIndicatorLabel(child.indicator)}"></span>
            <div>
              <div class="subgoal-row-title">
                <strong contenteditable="true" spellcheck="false">${child.title}</strong>
              </div>
              <div class="subgoal-row-detail" contenteditable="true" spellcheck="false">${child.detail}</div>
            </div>
            <div class="outliner-row-actions">
              <button class="outliner-icon-button" type="button" data-outline-remove aria-label="Remove outline item">−</button>
            </div>
          </div>
        `;
      }

      function renderSubgoalLedgerGoal(model) {
        return `
          <section class="subgoal-goal">
            <div class="subgoal-goal-header">
              <div>
                <p class="section-title">Goal</p>
                <div class="subgoal-goal-text">${model.goal}</div>
                <div class="goal-outliner-note">Editable outliner. Goal lines can move independently as Runner makes progress.</div>
              </div>
              <button class="outliner-add-button" type="button" data-outline-add>+ item</button>
              <span class="ledger-neutral-chip">${model.status}</span>
            </div>
            <div class="subgoal-list">
              ${model.subgoals
                .map((subgoal) => {
                  const count = subgoal.cards.length;
                  const childCount = subgoal.children?.length || 0;
                  const expanded = subgoal.id === model.defaultSubgoalId || subgoal.indicator === "needs-action";
