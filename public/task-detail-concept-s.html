                  const aggregateIndicator = aggregateSubgoalIndicator(subgoal);
                  return `
                    <div class="subgoal-row ${subgoal.id === model.defaultSubgoalId ? "focused" : ""}" data-subgoal-row="${subgoal.id}" data-ledger-subgoal-select="${subgoal.id}">
                      <span class="ledger-state-icon ${aggregateIndicator}" aria-label="${ledgerIndicatorLabel(aggregateIndicator)}"></span>
                      <div>
                        <div class="subgoal-row-title">
                          <strong contenteditable="true" spellcheck="false">${subgoal.title}</strong>
                          <button class="line-edit-button" type="button">Edit</button>
                        </div>
                        <div class="subgoal-row-detail" contenteditable="true" spellcheck="false">${subgoal.detail}</div>
                        ${renderSubgoalAggregate(subgoal)}
                      </div>
                      <div class="subgoal-row-status">
                        ${
                          count
                            ? `<button class="card-count-chip" type="button" data-ledger-cards="${subgoal.id}">${count} action${count > 1 ? "s" : ""}</button>`
                            : ""
                        }
                        ${
                          childCount
                            ? `<button class="outline-toggle-button ${expanded ? "" : "collapsed"}" type="button" data-outline-toggle="${subgoal.id}">${childCount} sub</button>`
                            : ""
                        }
                        <button class="outliner-icon-button" type="button" data-outline-remove aria-label="Remove goal line">−</button>
                      </div>
                    </div>
                    ${(subgoal.children || []).map((child) => renderOutlineChildRow(subgoal, child, !expanded)).join("")}
                  `;
                })
                .join("")}
            </div>
          </section>
        `;
      }

      function renderSubgoalActionLedger(stateKey) {
        const model = subgoalLedgerModel(states[stateKey], stateKey);
        return `
          <div class="subgoal-ledger" data-ledger-root="${stateKey}">
            ${renderLedgerExampleSwitcher(model)}
            ${renderSubgoalLedgerGoal(model)}
            <section class="subgoal-ledger-action" id="ledgerActionPanel">
              ${renderLedgerActionPanel(model, model.defaultSubgoalId)}
            </section>
          </div>
        `;
      }

      const todoListExampleStates = {
        dinner: "needs_review",
        renewal: "waiting_external",
        release: "needs_review",
      };

      function ledgerTaskIndicator(model) {
        const indicators = model.subgoals.map((subgoal) => aggregateSubgoalIndicator(subgoal));
        if (indicators.includes("needs-action")) return "needs-action";
        if (indicators.includes("waiting")) return "waiting";
        if (indicators.includes("working")) return "working";
        if (indicators.every((indicator) => indicator === "done")) return "done";
        return "todo";
      }

      function ledgerTaskOutlineCounts(model) {
        const items = model.subgoals.flatMap((subgoal) => [subgoal, ...(subgoal.children || [])]);
        return items.reduce(
          (memo, item) => {
            memo.total += 1;
            memo[item.indicator] = (memo[item.indicator] || 0) + 1;
            return memo;
          },
          { total: 0 },
        );
      }

      function ledgerTaskCardCount(model) {
        return model.subgoals.reduce((total, subgoal) => total + subgoal.cards.length, 0);
      }

      function ledgerCurrentSubgoal(model) {
        return model.subgoals.find((subgoal) => subgoal.id === model.defaultSubgoalId) || model.subgoals[0];
      }

      function renderTodoListTaskRow(model, stateKey) {
        const expanded = activeTodoExpanded && model.id === activeLedgerExample;
        const cardCount = ledgerTaskCardCount(model);
        const currentSubgoal = ledgerCurrentSubgoal(model);
        const outlineCounts = ledgerTaskOutlineCounts(model);
        const openCount = outlineCounts.total - (outlineCounts.done || 0);
        return `
          <div class="todo-row-shell ${expanded ? "expanded" : ""}">
            <button class="todo-list-row" type="button" data-todo-example="${model.id}" aria-expanded="${expanded ? "true" : "false"}">
              <div>
                <div class="todo-row-title">${model.ask}</div>
                <div class="todo-row-secondary">${model.status}${currentSubgoal ? ` · ${currentSubgoal.title}` : ""}</div>
              </div>
              <div class="todo-row-actions">
                <span class="ledger-neutral-chip">${outlineCounts.done || 0} done</span>
                ${openCount ? `<span class="ledger-neutral-chip">${openCount} open</span>` : ""}
                ${cardCount ? `<span class="card-count-chip">${cardCount} card${cardCount > 1 ? "s" : ""}</span>` : ""}
                <span class="todo-row-chevron" aria-hidden="true"></span>
              </div>
            </button>
            ${
              expanded
                ? `
                  <div class="todo-expanded" data-ledger-root="${stateKey}">
                    <div class="todo-expanded-inner">
                      ${renderSubgoalLedgerGoal(model)}
                      <section class="subgoal-ledger-action" id="ledgerActionPanel">
                        ${renderLedgerActionPanel(model, model.defaultSubgoalId)}
                      </section>
                    </div>
                  </div>
                `
                : ""
            }
          </div>
        `;
      }

      function renderTodoListGoalAction() {
        const exampleIds = Object.keys(ledgerExampleLabels);
        const models = exampleIds.map((id) => {
          const stateKey = todoListExampleStates[id] || "needs_review";
          return {
            stateKey,
            model: subgoalLedgerModel(states[stateKey], stateKey, id),
          };
        });
        const needsAttentionCount = models.filter(({ model }) => ledgerTaskIndicator(model) === "needs-action").length;
        return `
          <div class="todo-list-mock">
            <div class="todo-list-toolbar">
              <div class="todo-list-title">
                <h3>Tasks</h3>
                <span class="ledger-neutral-chip">${models.length} active</span>
                <span class="ledger-neutral-chip">${needsAttentionCount} need attention</span>
              </div>
              <div class="todo-filter" aria-label="Task view">
                <span class="active">All</span>
                <span>Review</span>
                <span>Time</span>
              </div>
            </div>
            <section class="todo-list-section">
              <div class="todo-section-header">
                <div class="todo-section-heading">
                  <strong>Tasks</strong>
                  <span class="ledger-neutral-chip">Project</span>
                </div>
                <button class="secondary-button" type="button">New task</button>
              </div>
              ${models.map(({ model, stateKey }) => renderTodoListTaskRow(model, stateKey)).join("")}
            </section>
          </div>
        `;
      }

      function setupTodoListGoalActionInteractions() {
        document.querySelectorAll("[data-todo-example]").forEach((button) => {
          button.addEventListener("click", () => {
            const nextExample = button.getAttribute("data-todo-example") || activeLedgerExample;
            if (nextExample === activeLedgerExample) {
              activeTodoExpanded = !activeTodoExpanded;
            } else {
              activeLedgerExample = nextExample;
              activeTodoExpanded = true;
            }
            render();
          });
        });
        const selectedStateKey = todoListExampleStates[activeLedgerExample] || "needs_review";
        setupSubgoalLedgerInteractions(selectedStateKey);
      }

      function setupSubgoalLedgerInteractions(stateKey) {
        const root = document.querySelector("[data-ledger-root]");
        const panel = document.getElementById("ledgerActionPanel");
        if (!root || !panel) return;
        const model = subgoalLedgerModel(states[stateKey], stateKey);
        let selectedSubgoalId = model.defaultSubgoalId;
        let selectedCardIndex = 0;
        let selectedEventId = null;
        let selectedActionMode = activeActionMode || "card";

        const focusSubgoal = (subgoalId) => {
          root.querySelectorAll("[data-subgoal-row]").forEach((row) => {
            row.classList.toggle("focused", row.getAttribute("data-subgoal-row") === subgoalId);
          });
        };

        const setOutlineExpanded = (subgoalId, expanded) => {
          root.querySelectorAll(`[data-outline-child-of="${subgoalId}"]`).forEach((row) => {
            row.classList.toggle("is-hidden", !expanded);
          });
          root.querySelectorAll(`[data-outline-toggle="${subgoalId}"]`).forEach((button) => {
            button.classList.toggle("collapsed", !expanded);
          });
        };

        const showActionPanel = (subgoalId, options = {}) => {
          const subgoalChanged = selectedSubgoalId !== subgoalId;
          selectedSubgoalId = subgoalId;
          selectedCardIndex = options.cardIndex || 0;
          selectedActionMode = options.mode || selectedActionMode || "card";
          activeActionMode = selectedActionMode;
          selectedEventId = selectedActionMode === "timeline" ? options.eventId || (subgoalChanged ? null : selectedEventId) : null;
          focusSubgoal(subgoalId);
          setOutlineExpanded(subgoalId, true);
          panel.innerHTML = renderLedgerActionPanel(model, subgoalId, {
            cardIndex: selectedCardIndex,
            eventId: selectedEventId,
            mode: selectedActionMode,
          });
        };

        const insertMockOutlineItem = () => {
          const selectedRows = Array.from(root.querySelectorAll(`[data-ledger-subgoal-select="${selectedSubgoalId}"]`));
          const anchor = selectedRows[selectedRows.length - 1] || root.querySelector(".subgoal-list > .subgoal-row:last-child");
          if (!anchor) return;
          const row = document.createElement("div");
          row.className = "subgoal-row outliner-child";
          row.setAttribute("data-ledger-subgoal-select", selectedSubgoalId);
          row.innerHTML = `
            <span class="ledger-state-icon todo" aria-label="Not started"></span>
            <div>
              <div class="subgoal-row-title">
                <strong contenteditable="true" spellcheck="false">New outline item</strong>
              </div>
              <div class="subgoal-row-detail" contenteditable="true" spellcheck="false">Describe the subtask.</div>
            </div>
            <div class="outliner-row-actions">
              <button class="outliner-icon-button" type="button" data-outline-remove aria-label="Remove outline item">−</button>
            </div>
          `;
          row.setAttribute("data-ledger-subgoal-select", selectedSubgoalId);
          row.setAttribute("data-outline-child-of", selectedSubgoalId);
          anchor.insertAdjacentElement("afterend", row);
          row.querySelector('[contenteditable="true"]')?.focus();
        };

        const removeOutlineRow = (button) => {
          const row = button.closest(".subgoal-row");
          if (!row) return;
          const parentId = row.getAttribute("data-subgoal-row");
          if (parentId) {
            let next = row.nextElementSibling;
            while (next?.classList.contains("outliner-child") && next.getAttribute("data-ledger-subgoal-select") === parentId) {
              const toRemove = next;
              next = next.nextElementSibling;
              toRemove.remove();
            }
          }
          row.remove();
        };

        root.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;

          const exampleButton = target.closest("[data-ledger-example]");
          if (exampleButton) {
            activeLedgerExample = exampleButton.getAttribute("data-ledger-example") || activeLedgerExample;
            render();
            return;
          }

          const addButton = target.closest("[data-outline-add]");
          if (addButton) {
            event.stopPropagation();
            insertMockOutlineItem();
            return;
          }

          const removeButton = target.closest("[data-outline-remove]");
          if (removeButton) {
            event.stopPropagation();
            removeOutlineRow(removeButton);
            return;
          }

          const toggleButton = target.closest("[data-outline-toggle]");
          if (toggleButton) {
            event.stopPropagation();
            const subgoalId = toggleButton.getAttribute("data-outline-toggle");
            const expanded = toggleButton.classList.contains("collapsed");
            setOutlineExpanded(subgoalId, expanded);
            return;
          }

          const cardButton = target.closest("[data-ledger-cards]");
          if (cardButton) {
            event.stopPropagation();
            showActionPanel(cardButton.getAttribute("data-ledger-cards"), { cardIndex: 0, mode: "card" });
            return;
          }

          const row = target.closest("[data-ledger-subgoal-select]");
          if (!row) return;
          if (target.closest(".line-edit-button") || target.closest('[contenteditable="true"]')) return;
          showActionPanel(row.getAttribute("data-ledger-subgoal-select"), { cardIndex: 0, mode: selectedActionMode });
        });

        panel.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const modeButton = target?.closest("[data-ledger-action-mode]");
          if (modeButton) {
            const nextMode = modeButton.getAttribute("data-ledger-action-mode") || "card";
            showActionPanel(selectedSubgoalId, {
              cardIndex: selectedCardIndex,
              eventId: nextMode === "timeline" ? selectedEventId : null,
              mode: nextMode,
            });
            return;
          }

          const eventChip = target?.closest("[data-ledger-event]");
          if (eventChip) {
            showActionPanel(eventChip.getAttribute("data-subgoal"), {
              eventId: eventChip.getAttribute("data-ledger-event"),
              mode: "timeline",
            });
            return;
          }
          const nav = target?.closest("[data-ledger-card-nav]");
          if (!nav) return;
          const subgoal = model.subgoals.find((item) => item.id === nav.getAttribute("data-ledger-card-nav"));
          const cardCount = subgoal?.cards.length || 0;
          if (!cardCount) return;
          const step = Number(nav.getAttribute("data-ledger-card-step") || 0);
          const nextIndex = (selectedCardIndex + step + cardCount) % cardCount;
          showActionPanel(nav.getAttribute("data-ledger-card-nav"), {
            cardIndex: nextIndex,
            mode: "card",
          });
        });
      }

      function focusedModels() {
        return Object.keys(ledgerExampleLabels).map((id) => {
          const stateKey = todoListExampleStates[id] || "needs_review";
          return {
            stateKey,
            model: subgoalLedgerModel(states[stateKey], stateKey, id),
          };
        });
      }

      function minimalEditState(modelId) {
        if (!minimalOutlineEdits[modelId]) {
          minimalOutlineEdits[modelId] = {
            additions: [],
            removedIds: new Set(),
            outlineLayout: null,
          };
        }
        return minimalOutlineEdits[modelId];
      }

      function minimalEscapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function minimalOutlineItem(title, parentId = null) {
        minimalOutlineDraftCounter += 1;
        return {
          id: `added-${minimalOutlineDraftCounter}`,
          parentId,
          title,
          detail: "Added by user.",
          indicator: "todo",
          children: [],
          cards: [],
          events: [],
        };
      }

      function applyMinimalOutlineEdits(model) {
        const edit = minimalOutlineEdits[model.id];
        if (!edit) return model;
        const removedIds = edit.removedIds;
        const nodeById = new Map();
        const cloneNode = (node) => {
          const cloned = {
            ...node,
            children: (node.children || []).filter((child) => !removedIds.has(child.id)).map((child) => cloneNode(child)),
          };
          nodeById.set(cloned.id, cloned);
          return cloned;
        };
        const subgoals = model.subgoals.filter((subgoal) => !removedIds.has(subgoal.id)).map((subgoal) => cloneNode(subgoal));

        edit.additions.forEach((item) => {
          if (removedIds.has(item.id)) return;
          const added = {
            ...item,
            children: [],
            cards: [],
            events: [],
            indicator: "todo",
          };
          const parent = item.parentId ? nodeById.get(item.parentId) : null;
          if (parent) parent.children = [...(parent.children || []), added];
          else subgoals.push(added);
          nodeById.set(added.id, added);
        });

        const defaultSubgoalId = subgoals.some((subgoal) => subgoal.id === model.defaultSubgoalId)
          ? model.defaultSubgoalId
          : subgoals[0]?.id;
        return {
          ...model,
          subgoals,
          defaultSubgoalId,
        };
      }

      function minimalBaseOutlineRows(model) {
        const rows = [];
        const appendNode = (node, parentId, depth) => {
          rows.push({
            ...node,
            parentId,
            depth,
            indicator: depth === 0 ? aggregateSubgoalIndicator(node) : node.indicator,
          });
          (node.children || []).forEach((child) => appendNode(child, node.id, depth + 1));
        };
        model.subgoals.forEach((subgoal) => appendNode(subgoal, null, 0));
        return rows;
      }

      function minimalParentForDepth(rows, slotIndex, depth) {
        if (depth <= 0) return null;
        for (let index = slotIndex - 1; index >= 0; index -= 1) {
          if (rows[index].depth === depth - 1) return rows[index].id;
        }
        return null;
      }

      function minimalNormalizeOutlineRows(rows) {
        const seen = new Map();
        return rows.map((row) => {
          let parentId = row.parentId && seen.has(row.parentId) && row.parentId !== row.id ? row.parentId : null;
          let depth = 0;
          if (parentId) {
            depth = (seen.get(parentId)?.depth || 0) + 1;
          }
          const normalized = { ...row, parentId, depth };
          seen.set(row.id, normalized);
          return normalized;
        });
      }

      function minimalOutlineRows(model) {
        const baseRows = minimalBaseOutlineRows(model);
        const edit = minimalEditState(model.id);
        if (!edit.outlineLayout?.length) return baseRows;

        const baseById = new Map(baseRows.map((row) => [row.id, row]));
        const seen = new Set();
        const orderedRows = [];
        edit.outlineLayout.forEach((layoutRow) => {
          const baseRow = baseById.get(layoutRow.id);
          if (!baseRow) return;
          orderedRows.push({
            ...baseRow,
            parentId: layoutRow.parentId || null,
            depth: Number(layoutRow.depth) || 0,
          });
          seen.add(baseRow.id);
        });
        baseRows.forEach((row) => {
          if (!seen.has(row.id)) orderedRows.push(row);
        });
        return minimalNormalizeOutlineRows(orderedRows);
      }

      function minimalStoreOutlineRows(model, rows) {
        const edit = minimalEditState(model.id);
        edit.outlineLayout = minimalNormalizeOutlineRows(rows).map((row) => ({
          id: row.id,
          parentId: row.parentId || null,
          depth: row.depth || 0,
        }));
      }

      function minimalOutlineDescendantIds(rows, rowId) {
        const ids = new Set([rowId]);
        let changed = true;
        while (changed) {
          changed = false;
          rows.forEach((row) => {
            if (row.parentId && ids.has(row.parentId) && !ids.has(row.id)) {
              ids.add(row.id);
              changed = true;
            }
          });
        }
        return ids;
      }

      function minimalFocusedModels() {
        return focusedModels().map(({ model, stateKey }) => ({
          stateKey,
          model: applyMinimalOutlineEdits(model),
        }));
      }

      function minimalCurrentModel() {
        const stateKey = todoListExampleStates[activeLedgerExample] || "needs_review";
        return applyMinimalOutlineEdits(subgoalLedgerModel(states[stateKey], stateKey, activeLedgerExample));
      }

      function focusedSummary(model) {
        const counts = ledgerTaskOutlineCounts(model);
        const done = counts.done || 0;
        const total = counts.total || 0;
        const open = Math.max(0, total - done);
        const cards = ledgerTaskCardCount(model);
        return { done, total, open, cards };
      }

      function renderFocusedCountChips(model) {
        const summary = focusedSummary(model);
        return `
          <span class="ledger-neutral-chip">${summary.done} done</span>
          ${summary.open ? `<span class="ledger-neutral-chip">${summary.open} open</span>` : ""}
          ${summary.cards ? `<span class="card-count-chip">${summary.cards} card${summary.cards > 1 ? "s" : ""}</span>` : ""}
        `;
      }

      function focusedProgressCategory(subgoal) {
        const indicator = aggregateSubgoalIndicator(subgoal);
        if (indicator === "done") return "complete";
        if (indicator === "todo") return "not-started";
        return "partial";
      }

      function focusedProgressCategoryLabel(category) {
        const labels = {
          complete: "Complete",
          partial: "In progress",
          "not-started": "Not started",
        };
        return labels[category] || "Progress";
      }

      function focusedProgressSegments(model) {
        const rank = {
          complete: 0,
          partial: 1,
          "not-started": 2,
        };
        return model.subgoals
          .map((subgoal, index) => {
            const category = focusedProgressCategory(subgoal);
            return { subgoal, index, category };
          })
          .sort((a, b) => rank[a.category] - rank[b.category] || a.index - b.index);
      }

      function findFocusedGoalScope(model, goalId) {
        if (!goalId) return null;
        for (const subgoal of model.subgoals) {
          if (subgoal.id === goalId) {
            return {
              id: subgoal.id,
              title: subgoal.title,
              detail: subgoal.detail,
              indicator: aggregateSubgoalIndicator(subgoal),
              parent: subgoal,
              line: subgoal,
              isChild: false,
            };
          }
          const child = (subgoal.children || []).find((item) => item.id === goalId);
          if (child) {
            return {
              id: child.id,
              title: child.title,
              detail: child.detail,
              indicator: child.indicator,
              parent: subgoal,
              line: child,
              isChild: true,
            };
          }
        }
        return null;
      }

      function focusedSelectedScope(model) {
        return findFocusedGoalScope(model, activeFocusedSubgoalId) || findFocusedGoalScope(model, model.defaultSubgoalId);
      }

      function formatFocusedList(items) {
        if (!items.length) return "";
        if (items.length === 1) return items[0];
        if (items.length === 2) return `${items[0]} and ${items[1]}`;
        return `${items.slice(0, -1).join(", ")}, and ${items[items.length - 1]}`;
      }

      function focusedDependencyTitles(model, scope) {
        if (!scope) return [];
        if (scope.isChild) {
          const siblings = scope.parent.children || [];
          const childIndex = siblings.findIndex((item) => item.id === scope.id);
          const openSiblings = siblings
            .slice(0, Math.max(0, childIndex))
            .filter((item) => item.indicator !== "done")
            .map((item) => item.title);
          if (openSiblings.length) return openSiblings;
        }
        const parentIndex = model.subgoals.findIndex((subgoal) => subgoal.id === scope.parent.id);
        return model.subgoals
          .slice(0, Math.max(0, parentIndex))
          .filter((subgoal) => aggregateSubgoalIndicator(subgoal) !== "done")
          .map((subgoal) => subgoal.title);
      }

      function focusedWaitingCopy(model, scope) {
        if (!scope) return "No activity has been recorded for this task yet.";
        const blockers = focusedDependencyTitles(model, scope);
        if (blockers.length) {
          return `Waiting on ${formatFocusedList(blockers)} to complete first.`;
        }
        if (scope.indicator === "waiting") {
          return "Waiting on an outside response before Runner can continue this line.";
        }
        if (scope.indicator === "todo") {
          return "This line has not started yet. Runner can begin once the current work clears.";
        }
        return "No activity has been recorded for this line yet.";
      }

      function renderFocusedProgressRail(model, selectedSubgoalId, size = "compact") {
        const selectedScope = findFocusedGoalScope(model, selectedSubgoalId) || findFocusedGoalScope(model, model.defaultSubgoalId);
        const selectedId = selectedScope?.parent.id || model.defaultSubgoalId;
        const interactive = size === "large";
        const segments = focusedProgressSegments(model);
        return `
          <div class="focused-progress-rail ${size === "large" ? "large" : ""}" style="--segments: ${model.subgoals.length}" aria-label="Goal progress">
            ${segments
              .map(({ subgoal, category }) => {
                const tag = interactive ? "button" : "span";
                return `
                  <${tag} class="progress-segment ${category} ${subgoal.id === selectedId ? "selected" : ""}" ${interactive ? `type="button" data-focused-progress="${subgoal.id}"` : ""} aria-label="${subgoal.title}: ${focusedProgressCategoryLabel(category)}">
                  </${tag}>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function renderFocusedTaskRow(model, stateKey) {
        const selected = model.id === activeLedgerExample;
        const currentSubgoal = ledgerCurrentSubgoal(model);
        return `
          <div class="todo-row-shell ${selected ? "expanded" : ""}">
            <div class="focused-task-row ${selected ? "selected" : ""}" role="button" tabindex="0" data-focused-task="${model.id}" aria-pressed="${selected ? "true" : "false"}">
              <div class="focused-row-main">
                <div>
                  <div class="todo-row-title">${model.ask}</div>
                  <div class="todo-row-secondary">${model.status}${currentSubgoal ? ` · ${currentSubgoal.title}` : ""}</div>
                </div>
                ${renderFocusedProgressRail(model, null, "compact")}
              </div>
              <div class="focused-row-meta">
                ${renderFocusedCountChips(model)}
                <span class="todo-row-chevron" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        `;
      }

      function renderFocusedGoalLine(subgoal, selectedSubgoalId) {
        const selected = subgoal.id === selectedSubgoalId;
        const aggregateIndicator = aggregateSubgoalIndicator(subgoal);
        return `
          <div class="focused-goal-line ${selected ? "selected" : ""}" data-focused-goal-line="${subgoal.id}">
            <span class="ledger-state-icon ${aggregateIndicator}" aria-label="${ledgerIndicatorLabel(aggregateIndicator)}"></span>
            <div>
              <div class="subgoal-row-title">
                <strong>${subgoal.title}</strong>
                <button class="line-edit-button" type="button">Edit</button>
              </div>
              <div class="subgoal-row-detail">${subgoal.detail}</div>
              ${renderSubgoalAggregate(subgoal)}
            </div>
            <div class="focused-line-actions">
              ${
                subgoal.cards.length
                  ? `<button class="summary-chip button-chip" type="button" data-focused-action-filter="${subgoal.id}">${subgoal.cards.length} action${subgoal.cards.length > 1 ? "s" : ""}</button>`
                  : ""
              }
            </div>
          </div>
          ${(subgoal.children || [])
            .map(
              (child) => `
                <div class="focused-goal-line child ${child.id === selectedSubgoalId ? "selected" : ""}" data-focused-goal-line="${child.id}">
                  <span class="ledger-state-icon ${child.indicator}" aria-label="${ledgerIndicatorLabel(child.indicator)}"></span>
                  <div>
                    <div class="subgoal-row-title">
                      <strong>${child.title}</strong>
                    </div>
                    <div class="subgoal-row-detail">${child.detail}</div>
                  </div>
                  <div class="focused-line-actions"></div>
                </div>
              `,
            )
            .join("")}
        `;
      }

      function renderFocusedGoalTab(model) {
        const selectedSubgoalId = activeFocusedSubgoalId || model.defaultSubgoalId;
        return `
          <section class="focused-action-section">
            <div class="focused-action-section-title">
              <div>
                <p class="section-title">Goal</p>
                <div class="subgoal-goal-text">${model.goal}</div>
              </div>
              <span class="ledger-neutral-chip">${model.status}</span>
            </div>
            <div class="focused-goal-list">
              ${model.subgoals.map((subgoal) => renderFocusedGoalLine(subgoal, selectedSubgoalId)).join("")}
            </div>
          </section>
        `;
      }

      function renderFocusedActionCard(subgoal, card) {
        return `
          <div class="ledger-card">
            <div class="ledger-card-header">
              <div>
                <div class="ledger-card-title">${card.title}</div>
                <div class="ledger-card-meta">${card.meta}</div>
                <div class="ledger-card-meta">Attached to: <strong>${subgoal.title}</strong></div>
              </div>
              <span class="ledger-neutral-chip">${card.status}</span>
            </div>
            <div class="ledger-card-body">
              <div class="ledger-message">${card.body}</div>
            </div>
            <div class="ledger-card-footer">
              <span class="fine muted">${card.blocking ? "Needs your response" : "Queued or informational card"}</span>
              <div class="button-row">
                ${card.primary ? `<button class="primary-button" type="button">${card.primary}</button>` : ""}
                ${card.secondary ? `<button class="secondary-button" type="button">${card.secondary}</button>` : ""}
              </div>
            </div>
          </div>
        `;
      }

      function focusedActivityEntriesForSubgoal(subgoal) {
        const events = subgoal.events.map((event) => ({ title: event.title, body: event.body, time: event.time, actor: event.actor, attachedTo: subgoal.title }));
        if (subgoal.resolution) {
          const latestEvent = subgoal.events[subgoal.events.length - 1];
          events.push({
            title: subgoal.resolution.title,
            body: subgoal.resolution.body,
            time: subgoal.resolution.time || latestEvent?.time || "Done",
            actor: subgoal.resolution.actor || "agent",
            attachedTo: subgoal.title,
          });
        }
        return events;
      }

      function focusedActivityEntriesForChild(scope) {
        const events = (scope.line.events || []).map((event) => ({
          title: event.title,
          body: event.body,
          time: event.time,
          actor: event.actor,
          attachedTo: `${scope.parent.title} / ${scope.title}`,
        }));
        if (scope.line.resolution) {
          events.push({
            title: scope.line.resolution.title,
            body: scope.line.resolution.body,
            time: scope.line.resolution.time || events[events.length - 1]?.time || "Done",
            actor: scope.line.resolution.actor || "agent",
            attachedTo: `${scope.parent.title} / ${scope.title}`,
          });
        }
        if (events.length) return events;
        if (scope.indicator === "todo") return [];
        const labels = {
          done: "Completed",
          working: "In progress",
          waiting: "Waiting",
          "needs-action": "Needs response",
        };
        const body = {
          done: `${scope.title} is complete as part of ${scope.parent.title}.`,
          working: `Runner is working on ${scope.title}. ${scope.detail}`,
          waiting: `Runner is paused on ${scope.title}. ${scope.detail}`,
          "needs-action": `${scope.title} needs a user response before this line can continue.`,
        };
        return [
          {
            title: labels[scope.indicator] || "Activity recorded",
            body: body[scope.indicator] || scope.detail,
            time: "Now",
            actor: "agent",
            attachedTo: scope.title,
          },
        ];
      }

      function focusedActivityEntries(model, scope = null) {
        if (!scope) return model.subgoals.flatMap((subgoal) => focusedActivityEntriesForSubgoal(subgoal));
        if (scope.isChild) return focusedActivityEntriesForChild(scope);
        return focusedActivityEntriesForSubgoal(scope.parent);
      }

      function renderFocusedActivityList(model, scope = null) {
        const events = focusedActivityEntries(model, scope);
        if (!events.length) {
          return `<div class="ledger-action-empty">${focusedWaitingCopy(model, scope)}</div>`;
        }
        return `
          <div class="focused-activity-list">
            ${events
              .map(
                (event) => `
                  <div class="focused-activity-item">
                    <span class="fine muted">${event.time}</span>
                    <div>
                      <div class="focused-activity-title">${event.title}</div>
                      <div class="focused-activity-body">${event.body}</div>
                      <div class="ledger-card-meta">Attached to: <strong>${event.attachedTo}</strong></div>
                    </div>
                    <span class="ledger-actor-badge ${event.actor}">${event.actor}</span>
                  </div>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderFocusedActionsTab(model) {
        const scope = activeFocusedSubgoalId ? findFocusedGoalScope(model, activeFocusedSubgoalId) : null;
        const scopedSubgoals = scope ? [scope.parent] : model.subgoals;
        const cards = scope?.isChild ? [] : scopedSubgoals.flatMap((subgoal) => subgoal.cards.map((card) => ({ subgoal, card })));
        return `
          <div class="focused-action-section">
            <div class="focused-actions-filter">
              <div class="ledger-action-context">
                ${
                  scope
                    ? `<span class="scope-filter-inline">Filtered to: <strong>${scope.title}</strong><button class="scope-clear-icon" type="button" data-focused-clear-filter aria-label="Clear filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></span>`
                    : `Showing: <strong>all action cards and activity</strong>`
                }
              </div>
              ${
                scope ? "" : `<span class="ledger-neutral-chip">all goal lines</span>`
              }
            </div>
            ${
              cards.length
                ? `<section class="focused-action-section">
                    <div class="focused-action-section-title">
                      <p class="section-title">Action cards</p>
                      <span class="ledger-neutral-chip">${cards.length}</span>
                    </div>
                    <div class="focused-action-stack">
                      ${cards.map(({ subgoal, card }) => renderFocusedActionCard(subgoal, card)).join("")}
                    </div>
                  </section>`
                : ""
            }
            <section class="focused-action-section">
              <div class="focused-action-section-title">
                <p class="section-title">Activity</p>
                <span class="ledger-neutral-chip">${scope ? "filtered" : "all"}</span>
              </div>
              ${renderFocusedActivityList(model, scope)}
            </section>
          </div>
        `;
      }

      function renderFocusedTaskDetail(model, stateKey) {
        const selectedScope = focusedSelectedScope(model);
        const selectedSubgoalId = selectedScope?.id || model.defaultSubgoalId;
        const summary = focusedSummary(model);
        return `
          <div class="focused-detail-page">
            <div class="focused-back-row">
              <button class="secondary-button" type="button" data-focused-back>Back to tasks</button>
              <span class="ledger-neutral-chip">${summary.done}/${summary.total} done</span>
            </div>
            <section class="focused-detail" data-focused-detail="${model.id}">
              <div class="focused-detail-header">
                <div class="focused-detail-heading">
                  <div>
                    <div class="focused-detail-title">${model.ask}</div>
                    <div class="focused-detail-subtitle">${model.status} · ${summary.done}/${summary.total} done · ${summary.cards} card${summary.cards === 1 ? "" : "s"}</div>
                  </div>
                  <span class="ledger-neutral-chip">${states[stateKey].label}</span>
                </div>
                ${renderFocusedProgressRail(model, selectedSubgoalId, "large")}
                <div class="focused-tabs" aria-label="Focused task view">
                  <button class="focused-tab-button ${activeFocusedTab === "goal" ? "active" : ""}" type="button" data-focused-tab="goal">Goal</button>
                  <button class="focused-tab-button ${activeFocusedTab === "actions" ? "active" : ""}" type="button" data-focused-tab="actions">Actions</button>
                </div>
              </div>
              <div class="focused-detail-body">
                ${activeFocusedTab === "actions" ? renderFocusedActionsTab(model) : renderFocusedGoalTab(model)}
              </div>
            </section>
          </div>
        `;
      }

      function renderFocusedTaskView() {
        const models = focusedModels();
        const selected = models.find(({ model }) => model.id === activeLedgerExample) || models[0];
        const needsAttentionCount = models.filter(({ model }) => ledgerTaskIndicator(model) === "needs-action").length;
        if (activeFocusedRoute === "detail") {
          return `
            <div class="focused-task-workspace">
              ${renderFocusedTaskDetail(selected.model, selected.stateKey)}
            </div>
          `;
        }
        return `
          <div class="focused-task-workspace">
            <div class="todo-list-toolbar">
              <div class="todo-list-title">
                <h3>Tasks</h3>
                <span class="ledger-neutral-chip">${models.length} active</span>
                <span class="ledger-neutral-chip">${needsAttentionCount} need attention</span>
              </div>
              <div class="todo-filter" aria-label="Task view">
                <span class="active">All</span>
                <span>Review</span>
                <span>Time</span>
              </div>
            </div>
            <section class="todo-list-section">
              <div class="todo-section-header">
                <div class="todo-section-heading">
                  <strong>Tasks</strong>
                  <span class="ledger-neutral-chip">Project</span>
                </div>
                <button class="secondary-button" type="button">New task</button>
              </div>
              ${models.map(({ model, stateKey }) => renderFocusedTaskRow(model, stateKey)).join("")}
            </section>
          </div>
        `;
      }

      function setupFocusedTaskViewInteractions() {
        const root = document.getElementById("playground");
        if (!root) return;
        root.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;

          const taskButton = target.closest("[data-focused-task]");
          if (taskButton) {
            activeLedgerExample = taskButton.getAttribute("data-focused-task") || activeLedgerExample;
            activeFocusedSubgoalId = null;
            activeFocusedTab = "goal";
            activeFocusedRoute = "detail";
            render();
            return;
          }

          const backButton = target.closest("[data-focused-back]");
          if (backButton) {
            activeFocusedRoute = "list";
            activeFocusedTab = "goal";
            render();
            return;
          }

          const tabButton = target.closest("[data-focused-tab]");
          if (tabButton) {
            activeFocusedTab = tabButton.getAttribute("data-focused-tab") || "goal";
            render();
            return;
          }

          const clearButton = target.closest("[data-focused-clear-filter]");
          if (clearButton) {
            activeFocusedSubgoalId = null;
            activeFocusedTab = "actions";
            render();
            return;
          }

          const actionFilter = target.closest("[data-focused-action-filter]");
          if (actionFilter) {
            activeFocusedSubgoalId = actionFilter.getAttribute("data-focused-action-filter");
            activeFocusedTab = "actions";
            render();
            return;
          }

          const progressSegment = target.closest("[data-focused-progress]");
          if (progressSegment) {
            activeFocusedSubgoalId = progressSegment.getAttribute("data-focused-progress");
            activeFocusedTab = "actions";
            render();
            return;
          }

          const goalLine = target.closest("[data-focused-goal-line]");
          if (goalLine && !target.closest(".line-edit-button")) {
            activeFocusedSubgoalId = goalLine.getAttribute("data-focused-goal-line");
            activeFocusedTab = "actions";
            render();
          }
        });
      }

      function minimalHumanActionCards(model, scope = null) {
        const subgoals = scope ? (scope.isChild ? [] : [scope.parent]) : model.subgoals;
        return subgoals.flatMap((subgoal) =>
          subgoal.cards.filter((card) => card.blocking).map((card) => ({ subgoal, card })),
        );
      }

      function minimalHumanActionCountForSubgoal(subgoal) {
        return subgoal.cards.filter((card) => card.blocking).length;
      }

      function minimalLinePath(model, lineId) {
        const scope = findFocusedGoalScope(model, lineId);
        if (!scope) return "";
        return scope.isChild ? `${scope.parent.title} / ${scope.title}` : scope.title;
      }

      function minimalActionCountForLine(model, lineId) {
        const scope = findFocusedGoalScope(model, lineId);
        if (!scope || scope.isChild) return 0;
        return minimalHumanActionCountForSubgoal(scope.parent);
      }

      function minimalActivityCountForLine(model, lineId) {
        const scope = findFocusedGoalScope(model, lineId);
        if (!scope) return 0;
        return focusedActivityEntries(model, scope).length;
      }

      function renderMinimalOutlineActionBadge(model, lineId) {
        const actionCount = minimalActivityCountForLine(model, lineId);
        const reviewCount = minimalActionCountForLine(model, lineId);
        if (!actionCount && !reviewCount) return "";
        return [
          actionCount
            ? `
              <button class="minimal-outline-action-badge" type="button" data-minimal-action-filter="${lineId}">
                ${actionCount} action${actionCount === 1 ? "" : "s"}
              </button>
            `
            : "",
          reviewCount
            ? `
              <button class="minimal-outline-action-badge" type="button" data-minimal-action-filter="${lineId}">
                ${reviewCount} review${reviewCount === 1 ? "" : "s"}
              </button>
            `
            : "",
        ].join("");
      }

      function minimalOutlineAddMaxDepth(model) {
        const rows = minimalOutlineRows(model);
        const lastRow = rows[rows.length - 1];
        return lastRow ? (lastRow.depth || 0) + 1 : 0;
      }

      function minimalClampOutlineAddDepth(model, depth = activeMinimalOutlineAddDepth) {
        return Math.max(0, Math.min(minimalOutlineAddMaxDepth(model), depth));
      }

      function focusMinimalOutlineAddInput() {
        window.requestAnimationFrame(() => {
          const input = document.querySelector("[data-minimal-outline-add-input]");
          if (input instanceof HTMLInputElement) input.focus();
        });
      }

      function addMinimalOutlineItem(title, requestedDepth = activeMinimalOutlineAddDepth) {
        const trimmedTitle = title.trim();
        if (!trimmedTitle) return false;
        const model = minimalCurrentModel();
        const edit = minimalEditState(model.id);
        const rows = minimalOutlineRows(model);
        const depth = minimalClampOutlineAddDepth(model, requestedDepth);
        const parentId = minimalParentForDepth(rows, rows.length, depth);
        const item = minimalOutlineItem(trimmedTitle, parentId);
        edit.additions.push(item);
        minimalStoreOutlineRows(model, [...rows, { ...item, parentId, depth }]);
        activeMinimalOutlineAddDepth = depth;
        activeMinimalOutlineId = item.id;
        activeFocusedSubgoalId = item.id;
        activeFocusedTab = "goal";
        render();
        focusMinimalOutlineAddInput();
        return true;
      }

      function renderMinimalOutlineTools(model) {
        const addDepth = minimalClampOutlineAddDepth(model);
        activeMinimalOutlineAddDepth = addDepth;
        return `
          <div class="minimal-outline-tools" style="--add-depth: ${addDepth};">
            <div class="minimal-outline-add-row" data-minimal-outline-add-row data-minimal-outline-add-depth="${addDepth}">
              <span class="minimal-outline-add-icon" aria-hidden="true">+</span>
              <input
                class="minimal-outline-add-input"
                type="text"
                data-minimal-outline-add-input
                placeholder="Add a todo item..."
                aria-label="Add a todo item"
                autocomplete="off"
              />
            </div>
          </div>
        `;
      }

      function runMinimalOutlineCommand(command) {
        if (command === "add-bottom") addMinimalOutlineItem("New todo item", activeMinimalOutlineAddDepth);
      }

      function removeMinimalOutlineItem(rowId) {
        const model = minimalCurrentModel();
        const edit = minimalEditState(model.id);
        const rows = minimalOutlineRows(model);
        const removedIds = minimalOutlineDescendantIds(rows, rowId);
        removedIds.forEach((id) => edit.removedIds.add(id));
        const remainingRows = rows.filter((row) => !removedIds.has(row.id));
        minimalStoreOutlineRows(model, remainingRows);
        if (removedIds.has(activeMinimalOutlineId)) {
          activeMinimalOutlineId = remainingRows[0]?.id || null;
        }
        if (removedIds.has(activeFocusedSubgoalId)) {
          activeFocusedSubgoalId = activeMinimalOutlineId;
        }
        activeFocusedTab = "goal";
        render();
      }

      function minimalOutlineRowsMovedToSlot(rows, rowId, slotIndex, targetDepth) {
        if (!rowId) return rows;
        const movingIds = minimalOutlineDescendantIds(rows, rowId);
        const movingRows = rows.filter((row) => movingIds.has(row.id));
        const remainingRows = rows.filter((row) => !movingIds.has(row.id));
        if (!movingRows.length) return rows;

        const insertIndex = Math.max(0, Math.min(slotIndex, remainingRows.length));
        const previousRow = remainingRows[insertIndex - 1] || null;
        const maxDepth = previousRow ? previousRow.depth + 1 : 0;
        const depth = Math.max(0, Math.min(maxDepth, Number.isFinite(targetDepth) ? targetDepth : previousRow?.depth || 0));
        const parentId = minimalParentForDepth(remainingRows, insertIndex, depth);
        const originalRootDepth = movingRows[0].depth || 0;
        const depthDelta = depth - originalRootDepth;
        const adjustedRows = movingRows.map((row, index) => ({
          ...row,
          parentId: index === 0 ? parentId : row.parentId,
          depth: Math.max(depth, (row.depth || 0) + depthDelta),
        }));
        return minimalNormalizeOutlineRows([...remainingRows.slice(0, insertIndex), ...adjustedRows, ...remainingRows.slice(insertIndex)]);
      }

      function moveMinimalOutlineItemToSlot(rowId, slotIndex, targetDepth) {
        if (!rowId) return;
        const model = minimalCurrentModel();
        const rows = minimalOutlineRows(model);
        const nextRows = minimalOutlineRowsMovedToSlot(rows, rowId, slotIndex, targetDepth);
        minimalStoreOutlineRows(model, nextRows);
        activeMinimalOutlineId = rowId;
        activeFocusedSubgoalId = rowId;
        activeFocusedTab = "goal";
        render();
      }

      function renderMinimalTaskTabs() {
        return `
          <div class="focused-tabs minimal-task-header-tabs" aria-label="Minimal task view">
            <button class="focused-tab-button ${activeFocusedTab === "goal" ? "active" : ""}" type="button" data-minimal-tab="goal">Goal</button>
            <button class="focused-tab-button ${activeFocusedTab === "actions" ? "active" : ""}" type="button" data-minimal-tab="actions">Actions</button>
          </div>
        `;
      }

      function minimalProgressCategory(subgoal) {
        const indicator = aggregateSubgoalIndicator(subgoal);
        return minimalProgressCategoryForIndicator(indicator);
      }

      function minimalProgressCategoryForIndicator(indicator) {
        if (indicator === "done") return "complete";
        if (indicator === "needs-action" || indicator === "needs-review") return "needs-action";
        if (indicator === "waiting") return "waiting";
        if (indicator === "working") return "working";
        return "not-started";
      }

      function minimalProgressCategoryLabel(category) {
        const labels = {
          complete: "Complete",
          working: "Runner is working",
          waiting: "Waiting",
          "needs-action": "Needs your response",
          "not-started": "Not started",
        };
        return labels[category] || "Progress";
      }

      function minimalProgressKey(model, lineId) {
        return `${model.id}::${lineId}`;
      }

      function minimalOutlineGroupRootId(rows, rowId) {
        const byId = new Map(rows.map((row) => [row.id, row]));
        let current = byId.get(rowId);
        if (!current) return rowId;
        const seen = new Set();
        while (current?.parentId && byId.has(current.parentId) && !seen.has(current.parentId)) {
          seen.add(current.id);
          current = byId.get(current.parentId);
        }
        return current?.id || rowId;
      }

      function minimalOutlineGroupRows(rows, rootId) {
        return rows.filter((row) => minimalOutlineGroupRootId(rows, row.id) === rootId);
      }

      function minimalProgressCategoryForRows(rows) {
        const indicator =
          rows
            .map((row) => row.indicator)
            .sort((a, b) => ledgerStatusPriority(b) - ledgerStatusPriority(a))[0] || "todo";
        return minimalProgressCategoryForIndicator(indicator);
      }

      function minimalHumanActionCountForRows(model, rows) {
        return rows.reduce((total, row) => total + minimalActionCountForLine(model, row.id), 0);
      }

      function minimalProgressSegments(model, rows = minimalOutlineRows(model)) {
        const rank = {
          complete: 0,
          working: 1,
          waiting: 1,
          "needs-action": 1,
          "not-started": 2,
        };
        return rows
          .filter((row) => !row.parentId)
          .map((root, index) => {
            const groupRows = minimalOutlineGroupRows(rows, root.id);
            const category = minimalProgressCategoryForRows(groupRows);
            return {
              root,
              index,
              category,
              groupRows,
              weight: Math.max(1, groupRows.length),
              key: minimalProgressKey(model, root.id),
              humanActionCount: minimalHumanActionCountForRows(model, groupRows),
            };
          })
          .sort((a, b) => rank[a.category] - rank[b.category] || a.index - b.index);
      }

      function renderMinimalProgressSegments(model, selectedSubgoalId, rows, interactive) {
        const selectedId = selectedSubgoalId ? minimalOutlineGroupRootId(rows, selectedSubgoalId) : null;
        const segments = minimalProgressSegments(model, rows);
        return segments
          .map(({ root, category, key, humanActionCount, weight }) => {
            const tag = interactive ? "button" : "span";
            const categoryLabel = minimalProgressCategoryLabel(category);
            const tooltipLabel = minimalEscapeHtml(`${root.title}: ${categoryLabel}`);
            const isDragSource = key === activeMinimalOutlineDragSourceKey;
            const isDragTarget = key === activeMinimalOutlineDragTargetKey;
            const dragClass = `${isDragSource ? " drag-source" : ""}${isDragTarget ? " drag-target" : ""}`;
            const dragLabel = isDragSource && isDragTarget ? "moving" : isDragSource ? "from" : isDragTarget ? "to" : "";
            return `
              <${tag}
                class="minimal-progress-segment ${category} ${root.id === selectedId ? "selected" : ""}${dragClass}"
                style="--segment-grow: ${weight};"
                ${interactive ? `type="button" data-minimal-progress="${root.id}"` : ""}
                data-minimal-progress-line="${key}"
                data-minimal-progress-label="${tooltipLabel}"
                ${dragLabel ? `data-drag-label="${dragLabel}"` : ""}
                data-label="${minimalEscapeHtml(root.title)}"
                aria-label="${tooltipLabel}">
                ${humanActionCount > 1 ? `<span class="minimal-progress-attention">${humanActionCount}</span>` : ""}
              </${tag}>
            `;
          })
          .join("");
      }

      function renderMinimalProgressRail(model, selectedSubgoalId, size = "compact", rows = minimalOutlineRows(model)) {
        const interactive = size === "large";
        return `
          <div
            class="minimal-progress-rail ${size === "large" ? "large" : ""} ${activeMinimalOutlineDragId ? "dragging" : ""}"
            data-minimal-progress-rail="${model.id}"
            data-minimal-progress-size="${size}"
            data-minimal-progress-selected="${selectedSubgoalId || ""}"
            aria-label="Goal progress">
            ${renderMinimalProgressSegments(model, selectedSubgoalId, rows, interactive)}
          </div>
        `;
      }

      function minimalProgressAnimationKey(segment) {
        const rail = segment.closest("[data-minimal-progress-rail]");
        return [
          rail?.getAttribute("data-minimal-progress-rail") || "",
          rail?.getAttribute("data-minimal-progress-size") || "",
          segment.getAttribute("data-minimal-progress-line") || "",
        ].join("::");
      }

      function captureMinimalProgressRects(scope = document) {
        const rects = new Map();
        scope.querySelectorAll("[data-minimal-progress-line]").forEach((segment) => {
          const rect = segment.getBoundingClientRect();
          rects.set(minimalProgressAnimationKey(segment), {
            left: rect.left,
            width: rect.width,
          });
        });
        return rects;
      }

      function animateMinimalProgressFromRects(rects, scope = document, duration = 260) {
        if (!rects?.size || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        scope.querySelectorAll("[data-minimal-progress-line]").forEach((segment) => {
          const previous = rects.get(minimalProgressAnimationKey(segment));
          if (!previous || previous.width <= 0) return;
          const next = segment.getBoundingClientRect();
          if (next.width <= 0) return;
          const deltaX = previous.left - next.left;
          const scaleX = previous.width / next.width;
          if (Math.abs(deltaX) < 0.5 && Math.abs(scaleX - 1) < 0.01) return;
          segment.style.transformOrigin = "left center";
          segment.style.willChange = "transform";
          const animation = segment.animate(
            [
              { transform: `translateX(${deltaX}px) scaleX(${scaleX})` },
              { transform: "translateX(0) scaleX(1)" },
            ],
            {
              duration,
              easing: "cubic-bezier(0.2, 0.8, 0.2, 1)",
            },
          );
          animation.finished
            .catch(() => {})
            .finally(() => {
              segment.style.willChange = "";
              segment.style.transformOrigin = "";
            });
        });
      }

      function refreshMinimalProgressRails(model, rows, duration = 220) {
        const root = document.getElementById("playground");
        if (!root) return;
        const oldRects = captureMinimalProgressRects(root);
        root.querySelectorAll(`[data-minimal-progress-rail="${CSS.escape(model.id)}"]`).forEach((rail) => {
          const size = rail.getAttribute("data-minimal-progress-size") || "compact";
          const selectedSubgoalId = rail.getAttribute("data-minimal-progress-selected") || null;
          rail.classList.toggle("dragging", Boolean(activeMinimalOutlineDragId));
          rail.innerHTML = renderMinimalProgressSegments(model, selectedSubgoalId, rows, size === "large");
        });
        animateMinimalProgressFromRects(oldRects, root, duration);
      }

      function minimalDragImage() {
        if (!minimalTransparentDragImage) {
          minimalTransparentDragImage = new Image();
          minimalTransparentDragImage.src =
            "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
        }
        return minimalTransparentDragImage;
      }

      function renderMinimalTaskHeader(model, stateKey, expanded) {
        const currentSubgoal = ledgerCurrentSubgoal(model);
        const selectedSubgoalId = expanded ? activeFocusedSubgoalId || model.defaultSubgoalId : null;
        const headerAttributes = expanded
          ? `role="group" aria-expanded="true"`
          : `role="button" tabindex="0" data-minimal-task="${model.id}" aria-expanded="false"`;
        return `
          <div class="minimal-task-header" ${headerAttributes}>
            <div class="minimal-task-header-main">
              <div class="minimal-task-header-copy">
                <div>
                  <div class="todo-row-title">${model.ask}</div>
                  <div class="todo-row-secondary">${model.status}${currentSubgoal ? ` · ${currentSubgoal.title}` : ""}</div>
                </div>
                <span class="ledger-neutral-chip">${states[stateKey].label}</span>
              </div>
              ${renderMinimalProgressRail(model, selectedSubgoalId, expanded ? "large" : "compact")}
              ${expanded ? renderMinimalTaskTabs() : ""}
            </div>
            ${expanded ? "" : `<span class="todo-row-chevron" aria-hidden="true"></span>`}
          </div>
        `;
      }

      function renderMinimalTaskRow(model, stateKey, forceExpanded = false) {
        const expanded = forceExpanded || (activeFocusedRoute === "detail" && model.id === activeLedgerExample);
        return `
          <div class="minimal-task-card ${expanded ? "expanded" : ""}" data-minimal-task-card="${model.id}">
            ${renderMinimalTaskHeader(model, stateKey, expanded)}
            ${
              expanded
                ? `<div class="minimal-task-content" data-minimal-detail="${model.id}">
                    ${activeFocusedTab === "actions" ? renderMinimalActionsTab(model) : renderMinimalGoalTab(model)}
                  </div>`
                : ""
            }
          </div>
        `;
      }

      function renderMinimalOutlineRow(model, row, rows) {
        const depth = row.depth || 0;
        const actionBadge = renderMinimalOutlineActionBadge(model, row.id);
        const progressLineId = minimalOutlineGroupRootId(rows, row.id);
        const progressKey = minimalProgressKey(model, progressLineId);
        const progressCategory = minimalProgressCategoryForRows(minimalOutlineGroupRows(rows, progressLineId));
        const title = minimalEscapeHtml(row.title);
        const detail = minimalEscapeHtml(row.detail || "");
        return `
          <div
            class="minimal-outline-row ${depth ? "child" : ""} ${row.indicator} progress-${progressCategory}"
            data-minimal-goal-line="${row.id}"
            data-minimal-outline-row="${row.id}"
            data-minimal-outline-depth="${depth}"
            data-minimal-outline-progress-line="${progressKey}"
            draggable="true"
            style="padding-left: ${depth * 24}px; --drop-indent: ${depth * 24}px;"
            title="${detail}">
            <span class="ledger-state-icon ${row.indicator}" aria-label="${ledgerIndicatorLabel(row.indicator)}"></span>
            <div class="minimal-outline-text">
              <div class="minimal-outline-title">${title}</div>
            </div>
            <div class="minimal-outline-meta">
              ${actionBadge}
              <button class="minimal-outline-remove" type="button" data-minimal-outline-remove="${row.id}" aria-label="Remove ${title}">x</button>
            </div>
          </div>
        `;
      }

      function renderMinimalGoalTab(model) {
        const rows = minimalOutlineRows(model);
        return `
          <section class="minimal-goal-section">
            <div class="minimal-goal-copy">
              <div>
                <p class="minimal-goal-label">Goal</p>
                <div class="minimal-goal-description">${model.goal}</div>
              </div>
            </div>
            <div class="minimal-goal-body">
              <div class="minimal-outline">
                ${rows.map((row) => renderMinimalOutlineRow(model, row, rows)).join("")}
                ${renderMinimalOutlineTools(model)}
              </div>
            </div>
          </section>
        `;
      }

      function renderMinimalHumanActionCard(model, cards, scope) {
        if (!cards.length) {
          return "";
        }
        const safeIndex = ((activeMinimalCardIndex % cards.length) + cards.length) % cards.length;
        const { subgoal, card } = cards[safeIndex];
        const attachedPath = minimalLinePath(model, subgoal.id) || subgoal.title;
        return `
          <section class="focused-action-section">
            <div class="focused-action-section-title">
              <p class="section-title">Human action</p>
              ${
                cards.length > 1
                  ? `<div class="minimal-card-nav">
                      <button class="card-arrow-button" type="button" data-minimal-card-step="-1" aria-label="Previous human action">‹</button>
                      <span class="ledger-neutral-chip">${safeIndex + 1} / ${cards.length}</span>
                      <button class="card-arrow-button" type="button" data-minimal-card-step="1" aria-label="Next human action">›</button>
                    </div>`
                  : `<span class="ledger-neutral-chip">1</span>`
              }
            </div>
            <div class="minimal-human-card">
              <div class="minimal-human-card-header">
                <div>
                  <div class="minimal-human-card-title">${card.title}</div>
                  <div class="minimal-human-card-meta">${card.meta}</div>
                  <div class="minimal-human-card-meta">Todo: <strong>${attachedPath}</strong></div>
                </div>
                <span class="ledger-neutral-chip">${card.status}</span>
              </div>
              <div class="minimal-human-card-body">
                <div class="minimal-human-card-message">${card.body}</div>
              </div>
              <div class="minimal-human-card-footer">
                <span class="fine muted">Needs your response</span>
                <div class="button-row">
                  ${card.primary ? `<button class="primary-button" type="button">${card.primary}</button>` : ""}
                  ${card.secondary ? `<button class="secondary-button" type="button">${card.secondary}</button>` : ""}
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function minimalHistorySortKey(time, index) {
        if (time === "Now") return 100000 + index;
        const match = /^(\d+):(\d+)\s*(AM|PM)$/.exec(time);
        if (!match) return -10000 + index;
        let hours = Number(match[1]);
        const minutes = Number(match[2]);
        const meridiem = match[3];
        if (meridiem === "PM" && hours !== 12) hours += 12;
        if (meridiem === "AM" && hours === 12) hours = 0;
        return hours * 60 + minutes + index / 1000;
      }

      function minimalHistoryEntries(model, scope = null) {
        return focusedActivityEntries(model, scope)
          .map((event, index) => ({
            ...event,
            sortKey: minimalHistorySortKey(event.time, index),
          }))
          .sort((a, b) => b.sortKey - a.sortKey);
      }

      function renderMinimalRecentHistory(model, scope = null) {
        const events = minimalHistoryEntries(model, scope);
        if (!events.length) {
          return `<div class="ledger-action-empty">${focusedWaitingCopy(model, scope)}</div>`;
        }
        const visibleEvents = activeMinimalHistoryExpanded ? events : events.slice(0, 5);
        return `
          <div class="minimal-timeline ${activeMinimalHistoryExpanded ? "expanded" : ""}">
            ${visibleEvents
              .map(
                (event) => `
                  <div class="minimal-timeline-row">
                    <span class="fine muted">${event.time}</span>
                    <div>
                      <div class="minimal-timeline-title">${event.title}</div>
                      <div class="minimal-timeline-body">${event.body}</div>
                    </div>
                    <span class="ledger-actor-badge ${event.actor}">${event.actor}</span>
                  </div>
                `,
              )
              .join("")}
          </div>
          ${
            events.length > 5
              ? `<div class="minimal-history-footer">
                  <button class="secondary-button" type="button" data-minimal-history-toggle>
                    ${activeMinimalHistoryExpanded ? "Show recent 5" : `Show ${Math.min(10, events.length)} at once`}
                  </button>
                </div>`
              : ""
          }
        `;
      }

      function renderMinimalActionsTab(model) {
        const scope = activeFocusedSubgoalId ? findFocusedGoalScope(model, activeFocusedSubgoalId) : null;
        const humanCards = minimalHumanActionCards(model, scope);
        const historyCount = minimalHistoryEntries(model, scope).length;
        return `
          <div class="minimal-action-layout">
            ${
              scope
                ? `<div class="minimal-scope-row">
                    <div class="scope-filter-inline">Filtered to: <strong>${minimalLinePath(model, scope.id) || scope.title}</strong><button class="scope-clear-icon" type="button" data-minimal-clear-filter aria-label="Clear filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
                  </div>`
                : ""
            }
            ${renderMinimalHumanActionCard(model, humanCards, scope)}
            <section class="focused-action-section">
              <div class="focused-action-section-title">
                <p class="section-title">Recent history</p>
                <span class="ledger-neutral-chip">${
                  activeMinimalHistoryExpanded
                    ? `${historyCount} action${historyCount === 1 ? "" : "s"}`
                    : `${Math.min(5, historyCount)} recent`
                }</span>
              </div>
              ${renderMinimalRecentHistory(model, scope)}
            </section>
          </div>
        `;
      }

      function renderMinimalTaskDetail(model, stateKey) {
        const selectedScope = focusedSelectedScope(model);
        const selectedSubgoalId = selectedScope?.id || model.defaultSubgoalId;
        const summary = focusedSummary(model);
        return `
          <div class="focused-detail-page">
            <div class="focused-back-row">
              <button class="secondary-button" type="button" data-minimal-back>Back to tasks</button>
              <span class="ledger-neutral-chip">${summary.done}/${summary.total} done</span>
            </div>
            <section class="minimal-detail" data-minimal-detail="${model.id}">
              <div class="minimal-detail-header">
                <div class="focused-detail-heading">
                  <div>
                    <div class="focused-detail-title">${model.ask}</div>
                    <div class="focused-detail-subtitle">${model.status} · ${summary.done}/${summary.total} done · ${summary.cards} card${summary.cards === 1 ? "" : "s"}</div>
                  </div>
                  <span class="ledger-neutral-chip">${states[stateKey].label}</span>
                </div>
                ${renderMinimalProgressRail(model, selectedSubgoalId, "large")}
                <div class="focused-tabs" aria-label="Minimal task view">
                  <button class="focused-tab-button ${activeFocusedTab === "goal" ? "active" : ""}" type="button" data-minimal-tab="goal">Goal</button>
                  <button class="focused-tab-button ${activeFocusedTab === "actions" ? "active" : ""}" type="button" data-minimal-tab="actions">Actions</button>
                </div>
              </div>
              <div class="focused-detail-body">
                ${activeFocusedTab === "actions" ? renderMinimalActionsTab(model) : renderMinimalGoalTab(model)}
              </div>
            </section>
          </div>
        `;
      }

      function renderMinimalFocusedRoute(selected) {
        return `
          <div class="minimal-task-workspace detail-route">
            <div class="minimal-detail-route-nav">
              <button class="secondary-button" type="button" data-minimal-back>Back to tasks</button>
              <span class="ledger-neutral-chip">Focused task</span>
            </div>
            <section class="todo-list-section minimal-focused-section">
              ${renderMinimalTaskRow(selected.model, selected.stateKey, true)}
            </section>
          </div>
        `;
      }

      function renderMinimalTaskView() {
        const models = minimalFocusedModels();
        const selected = models.find(({ model }) => model.id === activeLedgerExample) || models[0];
        const needsAttentionCount = models.filter(({ model }) => ledgerTaskIndicator(model) === "needs-action").length;
        if (activeFocusedRoute === "detail") {
          return renderMinimalFocusedRoute(selected);
        }
        return `
          <div class="minimal-task-workspace">
            <div class="todo-list-toolbar">
              <div class="todo-list-title">
                <h3>Tasks</h3>
                <span class="ledger-neutral-chip">${models.length} active</span>
                <span class="ledger-neutral-chip">${needsAttentionCount} need attention</span>
              </div>
              <div class="todo-filter" aria-label="Task view">
                <span class="active">All</span>
                <span>Review</span>
                <span>Time</span>
              </div>
            </div>
            <section class="todo-list-section">
              <div class="todo-section-header">
                <div class="todo-section-heading">
                  <strong>Tasks</strong>
                  <span class="ledger-neutral-chip">Project</span>
                </div>
                <button class="secondary-button" type="button">New task</button>
              </div>
              ${models.map(({ model, stateKey }) => renderMinimalTaskRow(model, stateKey)).join("")}
            </section>
          </div>
        `;
      }

      function taskOrgModels() {
        return minimalFocusedModels();
      }

      function taskOrgSelected(models) {
        return models.find(({ model }) => model.id === activeLedgerExample) || models[0];
      }

      function taskOrgLaneForModel(model) {
        const indicator = ledgerTaskIndicator(model);
        if (indicator === "needs-action") return "needs-action";
        if (indicator === "waiting") return "waiting";
        if (indicator === "working") return "working";
        return "ready";
      }

      function taskOrgLaneCopy(laneId) {
        const copy = {
          "needs-action": {
            title: "Needs you",
            note: "Approvals, edits, and user-supplied facts.",
            empty: "No task needs a decision.",
          },
          working: {
            title: "Runner working",
            note: "Active work that should not interrupt the user.",
            empty: "No task is actively running.",
          },
          waiting: {
            title: "Waiting",
            note: "Paused on people, builds, or scheduled follow-up.",
            empty: "No task is blocked externally.",
          },
          ready: {
            title: "Ready later",
            note: "Accepted tasks without a current interruption.",
            empty: "No quiet backlog in this mock set.",
          },
        };
        return copy[laneId] || copy.ready;
      }

      function taskOrgIndicatorLabel(indicator) {
        if (indicator === "needs-action") return "needs you";
        if (indicator === "waiting") return "waiting";
        if (indicator === "working") return "working";
        if (indicator === "done") return "done";
        return "ready";
      }

      function taskOrgCardEntries(model) {
        return model.subgoals.flatMap((subgoal) => subgoal.cards.map((card) => ({ subgoal, card })));
      }

      function taskOrgNextAction(model) {
        const cards = taskOrgCardEntries(model);
        const blocking = cards.find(({ card }) => card.blocking);
        if (blocking) return blocking;
        const queued = cards[0];
        if (queued) return queued;
        const current = ledgerCurrentSubgoal(model);
        return current ? { subgoal: current, card: null } : null;
      }

      function taskOrgRecentEvents(model, limit = 5) {
        return model.subgoals
          .flatMap((subgoal) => focusedActivityEntriesForSubgoal(subgoal).map((event) => ({ ...event, attachedTo: subgoal.title })))
          .slice(-limit);
      }

      function renderTaskOrgCard(model, stateKey) {
        const selected = model.id === activeLedgerExample;
        const indicator = ledgerTaskIndicator(model);
        const current = ledgerCurrentSubgoal(model);
        const summary = focusedSummary(model);
        return `
          <button class="task-org-card ${selected ? "selected" : ""}" type="button" data-org-task="${model.id}" aria-pressed="${selected ? "true" : "false"}">
            <div class="task-org-card-top">
              <span class="ledger-state-icon ${indicator}" aria-label="${ledgerIndicatorLabel(indicator)}"></span>
              <div>
                <div class="task-org-card-title">${model.ask}</div>
                <div class="task-org-card-meta">${model.status}${current ? ` · ${current.title}` : ""}</div>

            </div>
            ${renderFocusedProgressRail(model, null, "compact")}
            <div class="task-org-card-chips">
              <span class="ledger-neutral-chip">${states[stateKey].label}</span>
              <span class="ledger-neutral-chip">${summary.done}/${summary.total}</span>
              ${summary.cards ? `<span class="card-count-chip">${summary.cards} card${summary.cards > 1 ? "s" : ""}</span>` : ""}
            </div>
          </button>
        `;
      }

      function renderTaskOrgOutlinePreview(model, limit = 6) {
        const rows = model.subgoals.slice(0, limit);
        return `
          <div class="task-org-outline-mini">
            ${rows
              .map((subgoal) => {
                const indicator = aggregateSubgoalIndicator(subgoal);
                return `
                  <div class="task-org-line">
                    <span class="ledger-state-icon ${indicator}" aria-label="${ledgerIndicatorLabel(indicator)}"></span>
                    <div>
                      <div class="task-org-line-title">${subgoal.title}</div>
                      <div class="task-org-line-detail">${subgoal.detail}</div>

              .join("")}

      }

      function renderTaskOrgNextCard(model) {
        const next = taskOrgNextAction(model);
        if (!next) {
          return `
            <div class="task-org-next-card">
              <div class="task-org-next-title">No active surface</div>
              <div class="task-org-next-body">This task has no current card or goal line to inspect.</div>
            </div>

        }
        if (!next.card) {

          return `
            <div class="task-org-next-card">
              <div class="task-org-next-title">${next.subgoal.title}</div>
              <div class="task-org-next-body">${focusedWaitingCopy(model, findFocusedGoalScope(model, next.subgoal.id))}</div>
              <div class="task-org-card-chips">
                <span class="ledger-neutral-chip">${taskOrgIndicatorLabel(indicator)}</span>
                <span class="ledger-neutral-chip">no card</span>
