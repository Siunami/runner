        return `
          <div class="task-org-next-card">
            <div class="task-org-next-title">${next.card.title}</div>
            <div class="task-org-next-body">${next.card.body}</div>
            <div class="task-org-card-chips">
              <span class="ledger-neutral-chip">${next.card.status}</span>
              <span class="ledger-neutral-chip">attached to ${next.subgoal.title}</span>
            </div>
            <div class="button-row">
              ${next.card.primary ? `<button class="primary-button" type="button">${next.card.primary}</button>` : ""}
              ${next.card.secondary ? `<button class="secondary-button" type="button">${next.card.secondary}</button>` : ""}
            </div>
          </div>
        `;
      }

      function renderTaskOrgRecentHistory(model) {
        const events = taskOrgRecentEvents(model);
        if (!events.length) return `<div class="ledger-action-empty">No recent task history.</div>`;
        return `
          <div class="task-org-history">
            ${events
              .map(
                (event) => `

                      <div class="task-org-history-title">${event.title}</div>

      function renderTaskOrgDetail(selected, title = "Selected task") {
        const { model, stateKey } = selected;
        const summary = focusedSummary(model);
        const lane = taskOrgLaneCopy(taskOrgLaneForModel(model));
        return `
          <section class="task-org-detail">
            <div class="task-org-detail-header">
              <div>
                <div class="task-org-detail-title">${model.ask}</div>
                <div class="task-org-detail-subtitle">${model.status} · ${summary.done}/${summary.total} done · ${lane.title}</div>
              </div>
              <span class="ledger-neutral-chip">${title}</span>

            <div class="task-org-detail-grid">

                <div class="task-org-next-card">

                  <div class="task-org-next-body">${states[stateKey].label} places this task in <strong>${lane.title}</strong>. The grouping is a derived view from run state and open action cards.</div>
                </div>

            </div>

        `;

      function renderAttentionLanes() {
        const models = taskOrgModels();
        const selected = taskOrgSelected(models);
        const laneIds = ["needs-action", "working", "waiting", "ready"];
        const grouped = laneIds.reduce((memo, laneId) => ({ ...memo, [laneId]: [] }), {});
        models.forEach((entry) => {

                  <p class="task-org-summary-title">Attention lanes</p>

                <div>
                  <p class="task-org-summary-title">Outcome bundles</p>
                  <div class="task-org-summary-note">Organize the task list as a set of durable outcomes. Each bundle keeps the lead goal, open task lines, and next review surface together.</div>

                </div>
                <span class="ledger-neutral-chip">${meta.type}</span>

              <div class="outcome-detail-grid">

                    </div>

                    <p class="section-title">Open task lines</p>

                      ${selected.model.subgoals.map(renderOutcomeTaskLine).join("")}
                    </div>

                  <div>
                    <p class="section-title">Next review surface</p>

      function setupTaskOrganizationInteractions() {
        const root = document.getElementById("playground");
        if (!root) return;
        if (root.dataset.taskOrgBound === "true") return;
        root.dataset.taskOrgBound = "true";
        root.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const button = target?.closest("[data-org-task]");
          if (!button) return;
          activeLedgerExample = button.getAttribute("data-org-task") || activeLedgerExample;
          activeFocusedSubgoalId = null;
          activeMinimalOutlineId = null;
          activeMinimalCardIndex = 0;
          render();
        });
      }

      function setupMinimalTaskViewInteractions() {
        const root = document.getElementById("playground");
        if (!root) return;
        if (root.dataset.minimalTaskViewBound === "true") return;
        root.dataset.minimalTaskViewBound = "true";

        const ensureTooltip = () => {
          let tooltip = document.querySelector(".minimal-progress-tooltip");
          if (!tooltip) {
            tooltip = document.createElement("div");
            tooltip.className = "minimal-progress-tooltip";
            document.body.appendChild(tooltip);
          }
          return tooltip;
        };

        const positionTooltip = (segment) => {
          const tooltip = ensureTooltip();
          const rect = segment.getBoundingClientRect();
          const railRect = segment.closest(".minimal-progress-rail")?.getBoundingClientRect();
          const label = segment.getAttribute("data-minimal-progress-label") || segment.getAttribute("data-label") || "";
          tooltip.textContent = label;
          tooltip.classList.add("visible");
          const tooltipRect = tooltip.getBoundingClientRect();
          const margin = 12;
          const gap = 8;
          const rightLeft = rect.right + gap;
          const rightBoundary = railRect?.right ?? window.innerWidth - margin;
          const wouldBleedRight = rightLeft + tooltipRect.width > rightBoundary;
          const left = Math.min(
            Math.max(wouldBleedRight ? rect.left - tooltipRect.width - gap : rightLeft, margin),
            window.innerWidth - tooltipRect.width - margin,
          );
          const top = Math.min(
            Math.max(rect.top + rect.height / 2 - tooltipRect.height / 2, 12),
            window.innerHeight - tooltipRect.height - 12,
          );
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${top}px`;
        };

        const hideTooltip = () => {
          const tooltip = document.querySelector(".minimal-progress-tooltip");
          if (tooltip) tooltip.classList.remove("visible");
        };

        const clearMinimalHoverCoupling = () => {
          root.querySelectorAll(".minimal-progress-rail.hovering, .minimal-outline.hovering").forEach((container) => {
            container.classList.remove("hovering");
          });
          root.querySelectorAll(".hover-coupled").forEach((node) => {
            node.classList.remove("hover-coupled");
          });
        };

        const setMinimalHoverCoupling = (lineId, source = "progress") => {
          if (!lineId) {
            clearMinimalHoverCoupling();
            return;
          }
          clearMinimalHoverCoupling();
          root.querySelectorAll(`[data-minimal-progress-line="${CSS.escape(lineId)}"]`).forEach((segment) => {
            segment.classList.add("hover-coupled");
            segment.closest(".minimal-progress-rail")?.classList.add("hovering");
          });
          if (source === "progress") {
            root.querySelectorAll(`[data-minimal-outline-progress-line="${CSS.escape(lineId)}"]`).forEach((row) => {
              row.classList.add("hover-coupled");
              row.closest(".minimal-outline")?.classList.add("hovering");
            });
          }
        };

        root.addEventListener("pointerover", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const segment = target?.closest("[data-minimal-progress-label]");
          if (segment) {
            positionTooltip(segment);
            setMinimalHoverCoupling(segment.getAttribute("data-minimal-progress-line"), "progress");
            return;
          }
          const outlineRow = target?.closest("[data-minimal-outline-progress-line]");
          if (outlineRow) setMinimalHoverCoupling(outlineRow.getAttribute("data-minimal-outline-progress-line"), "outline");
        });

        root.addEventListener("pointermove", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const segment = target?.closest("[data-minimal-progress-label]");
          if (segment) positionTooltip(segment);
        });

        root.addEventListener("pointerout", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const segment = target?.closest("[data-minimal-progress-label]");
          const outlineRow = target?.closest("[data-minimal-outline-progress-line]");
          if (!segment && !outlineRow) return;
          const related = event.relatedTarget instanceof Element ? event.relatedTarget : null;
          if (segment && (!related || !segment.contains(related))) hideTooltip();
          const lineId =
            segment?.getAttribute("data-minimal-progress-line") ||
            outlineRow?.getAttribute("data-minimal-outline-progress-line") ||
            "";
          const nextLineId =
            related?.closest("[data-minimal-progress-line]")?.getAttribute("data-minimal-progress-line") ||
            related?.closest("[data-minimal-outline-progress-line]")?.getAttribute("data-minimal-outline-progress-line") ||
            "";
          if (lineId !== nextLineId) clearMinimalHoverCoupling();
        });

        root.addEventListener("focusin", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const segment = target?.closest("[data-minimal-progress-label]");
          if (segment) {
            positionTooltip(segment);
            setMinimalHoverCoupling(segment.getAttribute("data-minimal-progress-line"), "progress");
            return;
          }
          const outlineRow = target?.closest("[data-minimal-outline-progress-line]");
          if (outlineRow) setMinimalHoverCoupling(outlineRow.getAttribute("data-minimal-outline-progress-line"), "outline");
        });

        root.addEventListener("focusout", () => {
          hideTooltip();
          clearMinimalHoverCoupling();
        });

        const ensureMinimalOutlineDropIndicator = () => {
          let indicator = document.querySelector(".minimal-outline-drop-indicator");
          if (!indicator) {
            indicator = document.createElement("div");
            indicator.className = "minimal-outline-drop-indicator";
            document.body.appendChild(indicator);
          }
          return indicator;
        };

        const hideMinimalOutlineDropIndicator = () => {
          const indicator = document.querySelector(".minimal-outline-drop-indicator");
          if (indicator) indicator.style.display = "none";
        };

        const showMinimalOutlineDropIndicator = (row, position, depth) => {
          const indicator = ensureMinimalOutlineDropIndicator();
          const outlineRect = row.closest(".minimal-outline")?.getBoundingClientRect();
          const rowRect = row.getBoundingClientRect();
          const leftBase = outlineRect?.left ?? rowRect.left;
          const rightEdge = outlineRect?.right ?? rowRect.right;
          const left = Math.max(8, leftBase + depth * 24 + 2);
          const top = (position === "after" ? rowRect.bottom : rowRect.top) - 2;
          indicator.style.left = `${left}px`;
          indicator.style.top = `${top}px`;
          indicator.style.width = `${Math.max(32, rightEdge - left - 8)}px`;
          indicator.style.display = "block";
        };

        const clearMinimalOutlineDropTargets = () => {
          root.querySelectorAll(".minimal-outline-row.drop-before, .minimal-outline-row.drop-after, .minimal-outline-row.drop-target").forEach((row) => {
            row.classList.remove("drop-before", "drop-after", "drop-target");
            const depth = Number(row.getAttribute("data-minimal-outline-depth") || 0);
            row.style.setProperty("--drop-indent", `${depth * 24}px`);
          });
          hideMinimalOutlineDropIndicator();
        };

        const clearMinimalOutlineDragGroup = () => {
          activeMinimalOutlineDragIds = new Set();
          activeMinimalOutlineDragSourceKey = "";
          activeMinimalOutlineDragTargetKey = "";
          root.querySelectorAll(".minimal-outline-row.dragging-group, .minimal-outline-row.dragging-parent").forEach((row) => {
            row.classList.remove("dragging-group", "dragging-parent");
          });
        };

        const minimalOutlineRowDepth = (row) => Number(row.getAttribute("data-minimal-outline-depth") || 0);

        const minimalOutlineRawSlotIndex = (event, rows) => {
          const y = event.clientY;
          for (let index = 0; index < rows.length; index += 1) {
            const rect = rows[index].getBoundingClientRect();
            if (y < rect.top + rect.height / 2) return index;
          }
          return rows.length;
        };

        const minimalOutlineDefaultSlotDepth = (rows, slotIndex) => {
          const previousRow = rows[slotIndex - 1] || null;
          const nextRow = rows[slotIndex] || null;
          const previousDepth = previousRow ? minimalOutlineRowDepth(previousRow) : 0;
          const nextDepth = nextRow ? minimalOutlineRowDepth(nextRow) : 0;
          if (previousRow && nextRow) {
            if (previousDepth === nextDepth) return previousDepth;
            if (nextDepth > previousDepth) return nextDepth;
            return previousDepth;
          }
          if (previousRow) return previousDepth;
          return nextDepth;
        };

        const minimalOutlineSlotDepth = (event, outline, rows, slotIndex) => {
          const outlineRect = outline.getBoundingClientRect();
          const previousRow = rows[slotIndex - 1] || null;
          const maxDepth = previousRow ? minimalOutlineRowDepth(previousRow) + 1 : 0;
          const defaultDepth = Math.min(maxDepth, minimalOutlineDefaultSlotDepth(rows, slotIndex));
          const defaultLeft = outlineRect.left + defaultDepth * 24;
          let depth = defaultDepth;
          if (event.clientX < defaultLeft + 12) {
            depth -= Math.ceil((defaultLeft + 12 - event.clientX) / 24);
          } else if (event.clientX > defaultLeft + 56) {
            depth += Math.ceil((event.clientX - defaultLeft - 56) / 24);
          }
          return Math.max(0, Math.min(maxDepth, depth));
        };

        const minimalOutlineAdjustedSlotIndex = (rows, slotIndex, depth) => {
          let index = Math.max(0, Math.min(slotIndex, rows.length));
          while (index < rows.length && minimalOutlineRowDepth(rows[index]) > depth) {
            index += 1;
          }
          return index;
        };

        const minimalOutlineSlotVisualAnchor = (rows, slotIndex) => {
          if (!rows.length) return null;
          if (slotIndex <= 0) return { row: rows[0], position: "before" };
          if (slotIndex >= rows.length) return { row: rows[rows.length - 1], position: "after" };
          return { row: rows[slotIndex], position: "before" };
        };

        const minimalOutlineDragSlot = (event, target) => {
          const outline = target?.closest(".minimal-outline") || target?.closest("[data-minimal-outline-row]")?.closest(".minimal-outline");
          if (!outline) return null;
          const rows = [...outline.querySelectorAll("[data-minimal-outline-row]")].filter((row) => {
            const rowId = row.getAttribute("data-minimal-outline-row");
            return rowId && !activeMinimalOutlineDragIds.has(rowId);
          });
          if (!rows.length) return null;
          const rawIndex = minimalOutlineRawSlotIndex(event, rows);
          const depth = minimalOutlineSlotDepth(event, outline, rows, rawIndex);
          const index = minimalOutlineAdjustedSlotIndex(rows, rawIndex, depth);
          const anchor = minimalOutlineSlotVisualAnchor(rows, index);
          return anchor ? { ...anchor, index, depth } : null;
        };

        const clearMinimalOutlineDragPreview = () => {
          if (!activeMinimalOutlinePreviewKey) return;
          activeMinimalOutlinePreviewKey = "";
          activeMinimalOutlineDragTargetKey = "";
          const model = minimalCurrentModel();
          refreshMinimalProgressRails(model, minimalOutlineRows(model), 180);
        };

        const updateMinimalOutlineDragPreview = (slot) => {
          if (!activeMinimalOutlineDragId || !slot) {
            clearMinimalOutlineDragPreview();
            return;
          }
          const key = `${activeMinimalOutlineDragId}:${slot.index}:${slot.depth}`;
          if (key === activeMinimalOutlinePreviewKey) return;
          activeMinimalOutlinePreviewKey = key;
          const model = minimalCurrentModel();
          const rows = minimalOutlineRows(model);
          const previewRows = minimalOutlineRowsMovedToSlot(rows, activeMinimalOutlineDragId, slot.index, slot.depth);
          const targetRootId = minimalOutlineGroupRootId(previewRows, activeMinimalOutlineDragId);
          activeMinimalOutlineDragTargetKey = minimalProgressKey(model, targetRootId);
          refreshMinimalProgressRails(model, previewRows, 180);
        };

        root.addEventListener("dragstart", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (target?.closest("[data-minimal-outline-remove]")) return;
          const row = target?.closest("[data-minimal-outline-row]");
          if (!row) return;
          hideTooltip();
          clearMinimalHoverCoupling();
          activeMinimalOutlinePreviewKey = "";
          activeMinimalOutlineDragId = row.getAttribute("data-minimal-outline-row");
          if (!activeMinimalOutlineDragId) return;
          const model = minimalCurrentModel();
          const rows = minimalOutlineRows(model);
          const sourceRootId = minimalOutlineGroupRootId(rows, activeMinimalOutlineDragId);
          activeMinimalOutlineDragSourceKey = minimalProgressKey(model, sourceRootId);
          activeMinimalOutlineDragTargetKey = "";
          const movingIds = minimalOutlineDescendantIds(rows, activeMinimalOutlineDragId);
          activeMinimalOutlineDragIds = movingIds;
          event.dataTransfer?.setData("text/plain", activeMinimalOutlineDragId || "");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setDragImage(minimalDragImage(), 0, 0);
          }
          window.requestAnimationFrame(() => {
            movingIds.forEach((id) => {
              const movingRow = root.querySelector(`[data-minimal-outline-row="${id}"]`);
              movingRow?.classList.add("dragging-group");
            });
            row.classList.add("dragging-parent");
          });
          refreshMinimalProgressRails(model, rows, 0);
        });

        root.addEventListener("dragover", (event) => {
          if (!activeMinimalOutlineDragId) return;
          const target = event.target instanceof Element ? event.target : null;
          const slot = minimalOutlineDragSlot(event, target);
          const targetId = slot?.row.getAttribute("data-minimal-outline-row");
          if (!slot || !targetId) {
            clearMinimalOutlineDropTargets();
            clearMinimalOutlineDragPreview();
            return;
          }
          event.preventDefault();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          clearMinimalOutlineDropTargets();
          slot.row.style.setProperty("--drop-indent", `${slot.depth * 24}px`);
          slot.row.classList.add(`drop-${slot.position}`, "drop-target");
          showMinimalOutlineDropIndicator(slot.row, slot.position, slot.depth);
          updateMinimalOutlineDragPreview(slot);
        });

        root.addEventListener("drop", (event) => {
          if (!activeMinimalOutlineDragId) return;
          const target = event.target instanceof Element ? event.target : null;
          const slot = minimalOutlineDragSlot(event, target);
          const targetId = slot?.row.getAttribute("data-minimal-outline-row");
          if (!slot || !targetId) return;
          event.preventDefault();
          const droppedId = activeMinimalOutlineDragId;
          clearMinimalOutlineDropTargets();
          activeMinimalOutlinePreviewKey = "";
          activeMinimalOutlineDragId = null;
          activeMinimalOutlineDragSourceKey = "";
          activeMinimalOutlineDragTargetKey = "";
          clearMinimalOutlineDragGroup();
          moveMinimalOutlineItemToSlot(droppedId, slot.index, slot.depth);
        });

        root.addEventListener("dragend", () => {
          const model = minimalCurrentModel();
          activeMinimalOutlineDragId = null;
          activeMinimalOutlineDragSourceKey = "";
          activeMinimalOutlineDragTargetKey = "";
          clearMinimalOutlineDropTargets();
          clearMinimalOutlineDragPreview();
          clearMinimalOutlineDragGroup();
          refreshMinimalProgressRails(model, minimalOutlineRows(model), 120);
        });

        root.addEventListener("keydown", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          const addInput = target?.closest("[data-minimal-outline-add-input]");
          if (!(addInput instanceof HTMLInputElement)) return;

          if (event.key === "Enter") {
            event.preventDefault();
            addMinimalOutlineItem(addInput.value, activeMinimalOutlineAddDepth);
            return;
          }

          if (event.key === "Tab") {
            event.preventDefault();
            const model = minimalCurrentModel();
            const nextDepth = activeMinimalOutlineAddDepth + (event.shiftKey ? -1 : 1);
            activeMinimalOutlineAddDepth = minimalClampOutlineAddDepth(model, nextDepth);
            const tools = addInput.closest(".minimal-outline-tools");
            const row = addInput.closest("[data-minimal-outline-add-row]");
            tools?.style.setProperty("--add-depth", String(activeMinimalOutlineAddDepth));
            row?.setAttribute("data-minimal-outline-add-depth", String(activeMinimalOutlineAddDepth));
          }
        });

        root.addEventListener("click", (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          hideTooltip();

          const backButton = target.closest("[data-minimal-back]");
          if (backButton) {
            activeFocusedRoute = "list";
            activeFocusedTab = "goal";
            activeFocusedSubgoalId = null;
            activeMinimalOutlineId = null;
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            render();
            return;
          }

          const tabButton = target.closest("[data-minimal-tab]");
          if (tabButton) {
            activeFocusedTab = tabButton.getAttribute("data-minimal-tab") || "goal";
            if (activeFocusedTab === "actions") activeFocusedSubgoalId = null;
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            render();
            return;
          }

          const clearButton = target.closest("[data-minimal-clear-filter]");
          if (clearButton) {
            activeFocusedSubgoalId = null;
            activeFocusedTab = "actions";
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            render();
            return;
          }

          const cardNav = target.closest("[data-minimal-card-step]");
          if (cardNav) {
            activeMinimalCardIndex += Number(cardNav.getAttribute("data-minimal-card-step") || 0);
            activeFocusedTab = "actions";
            render();
            return;
          }

          const historyToggle = target.closest("[data-minimal-history-toggle]");
          if (historyToggle) {
            activeMinimalHistoryExpanded = !activeMinimalHistoryExpanded;
            activeFocusedTab = "actions";
            render();
            return;
          }

          const progressSegment = target.closest("[data-minimal-progress]");
          if (progressSegment) {
            activeFocusedSubgoalId = progressSegment.getAttribute("data-minimal-progress");
            activeFocusedTab = "actions";
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            render();
            return;
          }

          const actionFilter = target.closest("[data-minimal-action-filter]");
          if (actionFilter) {
            activeFocusedSubgoalId = actionFilter.getAttribute("data-minimal-action-filter");
            activeFocusedTab = "actions";
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            render();
            return;
          }

          const addRow = target.closest("[data-minimal-outline-add-row]");
          if (addRow) {
            const input = addRow.querySelector("[data-minimal-outline-add-input]");
            if (input instanceof HTMLInputElement) input.focus();
            return;
          }

          const outlineCommand = target.closest("[data-minimal-outline-command]");
          if (outlineCommand) {
            runMinimalOutlineCommand(outlineCommand.getAttribute("data-minimal-outline-command") || "");
            return;
          }

          const outlineRemove = target.closest("[data-minimal-outline-remove]");
          if (outlineRemove) {
            removeMinimalOutlineItem(outlineRemove.getAttribute("data-minimal-outline-remove"));
            return;
          }

          const goalLine = target.closest("[data-minimal-goal-line]");
          if (goalLine) {
            activeFocusedSubgoalId = goalLine.getAttribute("data-minimal-goal-line");
            activeFocusedTab = "actions";
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            render();
            return;
          }

          const taskButton = target.closest("[data-minimal-task]");
          if (taskButton) {
            const nextTask = taskButton.getAttribute("data-minimal-task") || activeLedgerExample;
            activeLedgerExample = nextTask;
            activeFocusedSubgoalId = null;
            activeMinimalOutlineId = null;
            activeFocusedTab = "goal";
            activeFocusedRoute = "detail";
            activeMinimalCardIndex = 0;
            activeMinimalHistoryExpanded = false;
            activeMinimalOutlineAddDepth = 0;
            render();
          }
        });
      }

      function renderBottomActionSlot(stateKey) {
        const state = states[stateKey];
        return `
          <div class="concept-shell">
            <div class="panel">
              <div class="panel-header">
                <p class="panel-title">Collapsed task row</p>
                <span class="panel-note">Composer-card model</span>
              </div>
              <div class="panel-body">
                ${taskRow(stateKey)}
                <div class="chips" style="padding: 0 10px 8px 41px;">
                  <span class="chip selected">bottom action slot</span>
                  <span class="chip green">attached: ${currentGoalStepForState(state)}</span>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <p class="panel-title">Bottom action slot</p>
                <span class="panel-note">One active card replaces the input</span>
              </div>
              <div class="panel-body">
                <div class="single-column-detail">
                  <div class="goal-state-card">
                    <div class="rail-header">
                      <p class="section-title">Goal</p>
                      <span class="chip selected">${state.progress}%</span>
                    </div>
                    <div class="card-body">${state.goal}</div>
                  </div>
                  <div>
                    <p class="section-title">Goal steps</p>
                    ${compactGoalSteps(state)}
                  </div>
                  <div>
                    <p class="section-title">Recent timeline</p>
                    ${compactTimelineChips(state)}
                  </div>
                  ${bottomComposerSlot(state)}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderControls() {
        const conceptControls = document.getElementById("conceptControls");
        conceptControls.innerHTML = concepts
          .map(
            (concept) =>
              `<button type="button" class="control-button ${concept.id === activeConcept ? "active" : ""}" data-concept="${concept.id}">${concept.name.replace("Concept ", "")}</button>`,
          )
          .join("");
        conceptControls.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            activeConcept = button.dataset.concept;
            render();
          });
        });

        const stateControls = document.getElementById("stateControls");
        stateControls.innerHTML = Object.entries(states)
          .map(
            ([key, state]) =>
              `<button type="button" class="control-button ${key === activeState ? "active" : ""}" data-state="${key}">${state.label}</button>`,
          )
          .join("");
        stateControls.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            activeState = button.dataset.state;
            render();
          });
        });
      }

      function render() {
        const concept = concepts.find((item) => item.id === activeConcept) || concepts[0];
        const state = states[activeState];
        const isSubgoalLedger = concept.id === "subgoal-action-ledger";
        const isTodoListGoalAction = concept.id === "todo-list-goal-action";
        const isFocusedTaskView = concept.id === "focused-task-view";
        const isMinimalTaskView = concept.id === "minimal-task-view";
        const isTaskOrganizationConcept = concept.id === "attention-lanes" || concept.id === "outcome-bundles";
        const isFocusedDetailRoute = isFocusedTaskView && activeFocusedRoute === "detail";
        const isMinimalDetailRoute = isMinimalTaskView && activeFocusedRoute === "detail";
        const usesDarkTaskMock =
          isSubgoalLedger || isTodoListGoalAction || isFocusedTaskView || isMinimalTaskView || isTaskOrganizationConcept;
        const ledgerModel = isSubgoalLedger ? subgoalLedgerModel(state, activeState) : null;
        const playground = document.getElementById("playground");
        const previousMinimalProgressRects = isMinimalTaskView && playground ? captureMinimalProgressRects(playground) : null;
        document.body.classList.toggle("dark-playground", usesDarkTaskMock);
        document.getElementById("conceptName").textContent = concept.name;
        document.getElementById("conceptDescription").textContent = concept.description;
        document.getElementById("pageTitle").textContent = isFocusedDetailRoute || isMinimalDetailRoute
          ? "Task detail"
          : isTodoListGoalAction || isFocusedTaskView || isMinimalTaskView || isTaskOrganizationConcept
            ? "Tasks"
            : ledgerModel?.title || state.title;
        document.getElementById("pageSubtitle").textContent = isFocusedTaskView
          ? isFocusedDetailRoute
            ? "Goal and Actions for the selected task."
            : "Task rows open a dedicated Goal and Actions detail view."
          : isMinimalTaskView
            ? isMinimalDetailRoute
              ? "Selected task header anchors Goal and Actions."
              : "Task rows open a focused Goal and Actions view."
          : isTaskOrganizationConcept
            ? "Alternative task organization sketches using the same task mock data."
          : isTodoListGoalAction
            ? "Task rows use the original user ask; expanded row shows Goal and Action."
          : "Current mock state: " + state.label + " | " + (ledgerModel?.status || state.status);
        document.getElementById("stateChips").innerHTML = usesDarkTaskMock
          ? `
            ${
              isTodoListGoalAction || isFocusedTaskView || isMinimalTaskView || isTaskOrganizationConcept
                ? `<span class="ledger-neutral-chip">3 active</span><span class="ledger-neutral-chip">2 need attention</span>`
                : `<span class="ledger-neutral-chip">${state.label}</span><span class="ledger-neutral-chip">${ledgerModel?.status || state.status}</span>`
            }
          `
          : `
            <span class="chip selected">${state.label}</span>
            <span class="chip">${state.status}</span>
            <span class="chip">${state.progress}% progress</span>
          `;
        playground.innerHTML = concept.render(activeState);
        renderControls();
        if (isSubgoalLedger) setupSubgoalLedgerInteractions(activeState);
        if (isTodoListGoalAction) setupTodoListGoalActionInteractions();
        if (isFocusedTaskView) setupFocusedTaskViewInteractions();
        if (isMinimalTaskView) setupMinimalTaskViewInteractions();
        if (isTaskOrganizationConcept) setupTaskOrganizationInteractions();
        if (isMinimalTaskView) animateMinimalProgressFromRects(previousMinimalProgressRects, playground);
      }

      render();
    </script>
  </body>
</html>
